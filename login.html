<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso - BANE Esports</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: { colors: { baneAccent: '#8b0000', baneAccentLight: '#ff4655' } }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Montserrat', sans-serif; background-color: #050505; color: white; }
        .font-heading { font-family: 'Cinzel', serif; }
    </style>
</head>
<body class="h-screen flex items-center justify-center p-4 relative overflow-hidden">

    <!-- Fondo decorativo -->
    <div class="absolute inset-0 z-0 opacity-10 flex items-center justify-center">
        <h1 class="font-heading text-[15rem] font-black text-white">BANE</h1>
    </div>

    <!-- Caja de Login -->
    <div class="bg-black border border-white/10 p-10 rounded-sm shadow-2xl z-10 w-full max-w-md">
        <div class="text-center mb-8">
            <h2 class="font-heading text-3xl font-black tracking-widest text-white mb-2">BANE <span class="text-baneAccentLight">LOGIN</span></h2>
            <p class="text-xs tracking-[0.2em] uppercase text-gray-500">Ingresa a tu cuenta</p>
        </div>
        
        <form id="form-login" class="flex flex-col gap-6">
            <div>
                <label class="text-[10px] uppercase tracking-widest text-gray-400 block mb-2">Correo Electrónico</label>
                <input type="email" id="email" class="w-full bg-[#0a0a0a] border border-white/10 text-white p-3 text-sm focus:border-baneAccentLight outline-none transition-colors" placeholder="tu@correo.com" required>
            </div>
            <div>
                <label class="text-[10px] uppercase tracking-widest text-gray-400 block mb-2">Contraseña</label>
                <input type="password" id="password" class="w-full bg-[#0a0a0a] border border-white/10 text-white p-3 text-sm focus:border-baneAccentLight outline-none transition-colors" placeholder="••••••••" required>
            </div>
            <p id="mensaje-error" class="text-baneAccentLight text-xs hidden text-center font-bold"></p>
            <button type="submit" id="btn-submit" class="mt-2 border border-baneAccentLight bg-baneAccentLight/10 text-baneAccentLight hover:bg-baneAccentLight hover:text-black font-bold uppercase tracking-widest text-xs py-4 transition-all">
                Iniciar Sesión
            </button>
        </form>
        
        <!-- ENLACES DE NAVEGACIÓN CORREGIDOS -->
        <div class="mt-6 text-center flex flex-col gap-4">
            <a href="registro.html" class="text-[10px] uppercase tracking-widest text-baneAccentLight hover:text-white transition-colors font-bold">¿No tienes cuenta? Regístrate aquí</a>
            <div class="w-16 h-[1px] bg-white/10 mx-auto"></div>
            <a href="index.html" class="text-[10px] uppercase tracking-widest text-gray-600 hover:text-white transition-colors">Volver al inicio</a>
        </div>
    </div>

    <!-- SDK de AWS Cognito -->
    <script src="https://unpkg.com/amazon-cognito-identity-js@6.3.1/dist/amazon-cognito-identity.min.js"></script>
    
    <script>
        // LA MISMA LISTA VIP PARA SABER A DÓNDE REDIRIGIR
        const CORREOS_ADMIN = [
            'ivonnesanchez057@gmail.com', 
            'luke@baneesports.com',
            'mary@baneesports.com',
            'vex@baneesports.com'
        ];

        document.getElementById('form-login').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const mensajeError = document.getElementById('mensaje-error');
            const btnSubmit = document.getElementById('btn-submit');
            
            btnSubmit.innerText = "AUTENTICANDO...";
            mensajeError.classList.add('hidden');

            // 1. Configuración de tu AWS Cognito
            const poolData = {
                UserPoolId: 'us-east-2_87KXfmchF', 
                ClientId: 'AQUI_VA_TU_CLIENT_ID_LARGO' // ¡RECUERDA PONER TU CLIENT ID AQUÍ!
            };
            
            const userPool = new AmazonCognitoIdentity.CognitoUserPool(poolData);
            
            const authenticationDetails = new AmazonCognitoIdentity.AuthenticationDetails({
                Username: email,
                Password: password,
            });
            
            const userData = {
                Username: email,
                Pool: userPool
            };
            
            const cognitoUser = new AmazonCognitoIdentity.CognitoUser(userData);
            
            // 2. Proceso de Login
            cognitoUser.authenticateUser(authenticationDetails, {
                onSuccess: function (result) {
                    const idToken = result.getIdToken().getJwtToken();
                    localStorage.setItem('idToken', idToken);
                    
                    // Decodificamos el token para leer el correo
                    const payload = JSON.parse(atob(idToken.split('.')[1]));
                    const correoUsuario = payload.email;
                    
                    // LÓGICA INTELIGENTE: Si es admin, va al panel. Si es fan, va al inicio.
                    if (CORREOS_ADMIN.includes(correoUsuario)) {
                        window.location.href = 'admin.html';
                    } else {
                        window.location.href = 'index.html';
                    }
                },
                onFailure: function(err) {
                    mensajeError.innerText = "Acceso denegado: " + (err.message || "Credenciales inválidas");
                    mensajeError.classList.remove('hidden');
                    btnSubmit.innerText = "INICIAR SESIÓN";
                }
            });
        });
    </script>
</body>
</html>
