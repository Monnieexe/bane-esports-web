<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscripción Oficial | 5ever</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { theme: { extend: { colors: { everRed: '#E60000', everGold: '#D4AF37', everDark: '#050505' } } } }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Montserrat', sans-serif; 
            background-color: #030303; 
            color: white; 
            background-image: linear-gradient(rgba(10,10,10,0.9), rgba(10,10,10,0.9)), url('https://www.transparenttextures.com/patterns/carbon-fibre.png');
        }
        .font-heading { font-family: 'Cinzel', serif; }
        
        .clip-box { clip-path: polygon(20px 0, 100% 0, 100% calc(100% - 20px), calc(100% - 20px) 100%, 0 100%, 0 20px); }
        .clip-btn { clip-path: polygon(15px 0, 100% 0, 100% calc(100% - 15px), calc(100% - 15px) 100%, 0 100%, 0 15px); }

        .input-ever { 
            background: #080808; 
            border: 1px solid rgba(255,255,255,0.05); 
            border-left: 3px solid #333;
            transition: all 0.3s; 
        }
        .input-ever:focus { 
            border-color: rgba(212, 175, 55, 0.5); 
            border-left-color: #D4AF37;
            outline: none; 
            box-shadow: inset 10px 0 20px -10px rgba(212, 175, 55, 0.2); 
            background: #0a0a0a;
        }
        
        .glass-panel { background: rgba(5,5,5,0.8); backdrop-filter: blur(15px); border: 1px solid rgba(255,255,255,0.05); }
    </style>
</head>
<body class="antialiased min-h-screen flex flex-col items-center justify-center p-6 relative overflow-hidden">

    <!-- Efecto luces de fondo -->
    <div class="absolute top-1/4 left-1/4 w-96 h-96 bg-everRed/10 blur-[120px] rounded-full -z-10 pointer-events-none"></div>
    <div class="absolute bottom-1/4 right-1/4 w-96 h-96 bg-everGold/10 blur-[120px] rounded-full -z-10 pointer-events-none"></div>

    <div class="w-full max-w-2xl clip-box glass-panel p-1 shadow-[0_20px_50px_rgba(0,0,0,0.8)] relative">
        <div class="bg-[#050505] clip-box p-8 md:p-14 w-full h-full relative">
            
            <a href="sorteo.html" class="absolute top-6 right-6 text-gray-500 hover:text-everGold text-[10px] uppercase tracking-[0.2em] font-bold transition-colors">
                ← Return to Arena
            </a>

            <div class="text-center mb-12">
                <div class="w-12 h-1 bg-everRed mx-auto mb-6"></div>
                <h1 class="font-heading text-4xl md:text-6xl font-black tracking-widest text-white mb-2"><span class="text-everRed">5</span>EVER</h1>
                <p class="text-everGold text-[9px] uppercase tracking-[0.5em] font-bold">Protocolo de Registro Oficial</p>
            </div>

            <form id="form-registro" class="flex flex-col gap-6">
                <div>
                    <label class="text-[9px] text-gray-500 uppercase tracking-[0.2em] mb-2 block font-bold">Identificación de Escuadra</label>
                    <input type="text" id="reg_nombre" required placeholder="Nombre del Equipo" class="input-ever w-full p-4 text-sm text-white font-bold tracking-wider">
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <label class="text-[9px] text-gray-500 uppercase tracking-[0.2em] mb-2 block font-bold">Contacto Capitán (Discord)</label>
                        <input type="text" id="reg_discord" required placeholder="Usuario#0000" class="input-ever w-full p-4 text-sm text-white font-bold tracking-wider">
                    </div>
                    <div>
                        <label class="text-[9px] text-gray-500 uppercase tracking-[0.2em] mb-2 block font-bold">Nivel Promedio</label>
                        <input type="text" id="reg_rango" required placeholder="Ej: Ascendente / Inmortal" class="input-ever w-full p-4 text-sm text-white font-bold tracking-wider">
                    </div>
                </div>

                <div>
                    <label class="text-[9px] text-gray-500 uppercase tracking-[0.2em] mb-2 block font-bold">Insignia Oficial (URL Logo PNG/JPG)</label>
                    <input type="url" id="reg_logo" placeholder="https://..." class="input-ever w-full p-4 text-sm text-white font-bold tracking-wider">
                </div>

                <button type="submit" id="btn-submit" class="mt-8 clip-btn bg-everRed text-white font-black text-sm uppercase tracking-[0.3em] py-5 hover:bg-everGold hover:text-black hover:shadow-[0_0_30px_rgba(212,175,55,0.4)] transition-all duration-300">
                    Asegurar Slot
                </button>
            </form>
        </div>
    </div>

    <script>
        document.getElementById('form-registro').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('btn-submit');
            btn.innerText = "Sincronizando con Nexus...";
            
            const payload = {
                nombre: document.getElementById('reg_nombre').value,
                discord_capitan: document.getElementById('reg_discord').value,
                rango: document.getElementById('reg_rango').value,
                logo_url: document.getElementById('reg_logo').value || ''
            };

            try {
                const res = await fetch('https://bane-esports-web-1.onrender.com/api/equipos', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                
                if(res.ok) {
                    alert("¡Escuadra registrada exitosamente en los servidores de 5ever!");
                    window.location.href = 'sorteo.html';
                } else {
                    alert("Error al registrar. Por favor, intenta de nuevo.");
                }
            } catch (err) {
                alert("Error de conexión. Revisa tu internet.");
            } finally {
                btn.innerText = "ASEGURAR SLOT";
            }
        });
    </script>
</body>
</html>
