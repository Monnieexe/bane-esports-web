<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscripción Oficial | 5ever</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { 
            theme: { extend: { colors: { everRed: '#E60000', everGold: '#D4AF37', everDark: '#0a0a0a' } } } 
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800;900&family=Montserrat:wght@300;400;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Montserrat', sans-serif; background-color: #030303; color: white; }
        .font-heading { font-family: 'Cinzel', serif; }
        .input-ever { background: #080808; border: 1px solid rgba(255,255,255,0.1); transition: all 0.3s; }
        .input-ever:focus { border-color: #D4AF37; outline: none; box-shadow: 0 0 15px rgba(212, 175, 55, 0.1); }
    </style>
</head>
<body class="antialiased min-h-screen flex flex-col items-center justify-center p-6 bg-[url('https://www.transparenttextures.com/patterns/cubes.png')] bg-fixed">

    <div class="w-full max-w-2xl bg-everDark border-t-4 border-everRed p-8 md:p-12 rounded-sm shadow-[0_20px_50px_rgba(0,0,0,0.5)] relative">
        
        <a href="sorteo.html" class="absolute top-6 right-6 text-gray-500 hover:text-everGold text-[10px] uppercase tracking-widest font-bold transition-colors">
            ← Volver a la Arena
        </a>

        <div class="text-center mb-10">
            <h1 class="font-heading text-4xl md:text-5xl font-black tracking-widest text-white mb-2"><span class="text-everRed">5</span>EVER</h1>
            <p class="text-everGold text-[10px] uppercase tracking-[0.4em] font-bold">Portal de Inscripción de Escuadras</p>
        </div>

        <form id="form-registro" class="flex flex-col gap-6">
            <div>
                <label class="text-[9px] text-gray-400 uppercase tracking-widest mb-2 block font-bold">Nombre del Equipo</label>
                <input type="text" id="reg_nombre" required placeholder="Ej: Sentinel Esports" class="input-ever w-full p-4 text-xs text-white">
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div>
                    <label class="text-[9px] text-gray-400 uppercase tracking-widest mb-2 block font-bold">Discord del Capitán</label>
                    <input type="text" id="reg_discord" required placeholder="Usuario#0000" class="input-ever w-full p-4 text-xs text-white">
                </div>
                <div>
                    <label class="text-[9px] text-gray-400 uppercase tracking-widest mb-2 block font-bold">Rango Promedio</label>
                    <input type="text" id="reg_rango" required placeholder="Ej: Platino / Diamante" class="input-ever w-full p-4 text-xs text-white">
                </div>
            </div>

            <div>
                <label class="text-[9px] text-gray-400 uppercase tracking-widest mb-2 block font-bold">URL del Logo (Opcional - Formato PNG/JPG)</label>
                <input type="url" id="reg_logo" placeholder="https://ejemplo.com/logo.png" class="input-ever w-full p-4 text-xs text-white">
            </div>

            <button type="submit" id="btn-submit" class="mt-6 bg-everRed text-white font-black text-xs md:text-sm uppercase tracking-[0.3em] py-5 hover:bg-everGold hover:text-black transition-all duration-300 shadow-[0_0_20px_rgba(230,0,0,0.3)]">
                Confirmar Inscripción
            </button>
        </form>
    </div>

    <script>
        document.getElementById('form-registro').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('btn-submit');
            btn.innerText = "PROCESANDO DATOS...";
            
            const payload = {
                nombre: document.getElementById('reg_nombre').value,
                discord_capitan: document.getElementById('reg_discord').value,
                rango: document.getElementById('reg_rango').value,
                logo_url: document.getElementById('reg_logo').value || ''
            };

            try {
                const res = await fetch('https://bane-esports-web-1.onrender.com/api/equipos', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                
                if(res.ok) {
                    alert("¡Escuadra registrada con éxito en 5ever!");
                    window.location.href = 'sorteo.html';
                } else {
                    alert("Error al registrar. Por favor, intenta de nuevo.");
                }
            } catch (err) {
                alert("Error de conexión. Revisa tu internet.");
            } finally {
                btn.innerText = "CONFIRMAR INSCRIPCIÓN";
            }
        });
    </script>
</body>
</html>
