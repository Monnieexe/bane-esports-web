<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>5ever | Admisión Oficial</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { theme: { extend: { colors: { vctRed: '#ff2a3f', everGold: '#e5c05c', bgDark: '#050507' } } } }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Montserrat', sans-serif; background-color: #020202; color: #fff; overflow-x: hidden; }
        
        /* Grid Holográfico */
        .holo-grid {
            position: fixed; inset: 0; z-index: -1;
            background-image: 
                linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
            background-size: 50px 50px;
            animation: gridMove 15s linear infinite;
        }
        @keyframes gridMove { 0% { transform: translateY(0); } 100% { transform: translateY(50px); } }

        .clip-panel { clip-path: polygon(20px 0, 100% 0, 100% calc(100% - 20px), calc(100% - 20px) 100%, 0 100%, 0 20px); }
        .clip-input { clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px); }
        
        .input-vct { 
            background: rgba(10,10,12,0.8); border: 1px solid rgba(255,255,255,0.05); 
            border-left: 2px solid rgba(255,255,255,0.2); transition: all 0.3s ease; 
        }
        .input-vct:focus { 
            border-color: #ff2a3f; border-left-color: #ff2a3f; background: #000;
            box-shadow: inset 15px 0 25px -15px rgba(255,42,63,0.4); outline: none; padding-left: 1.5rem;
        }
        
        .module-header { position: relative; overflow: hidden; }
        .module-header::after { content: ''; position: absolute; bottom: 0; left: -100%; width: 50%; height: 2px; background: #ff2a3f; animation: scanline 3s infinite; }
        @keyframes scanline { to { left: 200%; } }

        /* Efecto de carga inicial */
        .boot-screen { animation: fadeOut 1s 1.5s forwards; }
        @keyframes fadeOut { to { opacity: 0; pointer-events: none; visibility: hidden; } }
    </style>
</head>
<body class="antialiased min-h-screen flex flex-col items-center py-12 px-4 relative">

    <!-- Animación de Arranque -->
    <div class="boot-screen fixed inset-0 z-[100] bg-black flex flex-col items-center justify-center">
        <h1 class="text-4xl font-black text-white uppercase tracking-[0.5em] animate-pulse"><span class="text-vctRed">5</span>EVER</h1>
        <p class="text-[10px] text-everGold mt-4 tracking-[0.4em]">Iniciando Protocolo de Registro...</p>
        <div class="w-48 h-1 bg-white/10 mt-6 overflow-hidden"><div class="h-full bg-vctRed w-full animate-[slideRight_1.5s_ease-in-out]"></div></div>
    </div>

    <div class="holo-grid"></div>
    <div class="fixed inset-0 bg-gradient-to-b from-transparent via-[#020202]/80 to-[#020202] z-[-1]"></div>

    <div class="w-full max-w-5xl relative z-10">
        
        <!-- HEADER -->
        <div class="flex justify-between items-end mb-12">
            <div>
                <h1 class="text-5xl md:text-7xl font-black uppercase tracking-tighter text-white mb-2"><span class="text-vctRed">5</span>EVER <span class="text-transparent bg-clip-text bg-gradient-to-r from-everGold to-yellow-700">PORTAL</span></h1>
                <div class="flex items-center gap-3">
                    <div class="w-2 h-2 bg-vctRed rounded-full animate-ping"></div>
                    <p class="text-[10px] text-gray-400 uppercase tracking-[0.4em] font-bold">Inscripción Oficial de Escuadras</p>
                </div>
            </div>
            <a href="sorteo.html" class="hidden md:block text-[10px] font-black text-gray-500 hover:text-white border border-white/10 hover:border-white px-6 py-3 uppercase tracking-widest transition-colors clip-input">
                VOLVER A LA ARENA
            </a>
        </div>

        <form id="form-registro" class="flex flex-col gap-10">
            
            <!-- MÓDULO 01: IDENTIDAD -->
            <div class="bg-black/60 backdrop-blur-md border border-white/10 p-8 md:p-10 clip-panel shadow-[0_0_40px_rgba(0,0,0,0.5)]">
                <h2 class="module-header text-xl font-black text-white uppercase tracking-[0.2em] mb-8 pb-4 flex items-center gap-4">
                    <span class="bg-white text-black px-2 py-1 text-xs">01</span> IDENTIDAD DEL EQUIPO
                </h2>
                
                <div class="grid grid-cols-1 md:grid-cols-2 gap-8 mb-8">
                    <div>
                        <label class="text-[9px] text-everGold uppercase tracking-[0.2em] mb-3 block font-black">Nombre de la Escuadra *</label>
                        <input type="text" id="reg_nombre" required placeholder="Ej: BANE Ignite" class="input-vct clip-input w-full p-4 text-sm font-bold text-white">
                    </div>
                    <div>
                        <label class="text-[9px] text-everGold uppercase tracking-[0.2em] mb-3 block font-black">Discord del Capitán *</label>
                        <input type="text" id="reg_discord" required placeholder="Usuario#0000" class="input-vct clip-input w-full p-4 text-sm font-bold text-white">
                    </div>
                </div>
                <div>
                    <label class="text-[9px] text-gray-400 uppercase tracking-[0.2em] mb-3 block font-black">Emblema Oficial (URL de Logo PNG/JPG)</label>
                    <input type="url" id="reg_logo" placeholder="https://..." class="input-vct clip-input w-full p-4 text-sm font-bold text-white">
                </div>
            </div>

            <!-- MÓDULO 02: ROSTER TITULAR -->
            <div class="bg-black/60 backdrop-blur-md border border-white/10 p-8 md:p-10 clip-panel shadow-[0_0_40px_rgba(0,0,0,0.5)]">
                <h2 class="module-header text-xl font-black text-white uppercase tracking-[0.2em] mb-2 pb-4 flex items-center gap-4">
                    <span class="bg-everGold text-black px-2 py-1 text-xs">02</span> ROSTER TITULAR
                </h2>
                <p class="text-[10px] text-gray-500 uppercase tracking-widest mb-8 font-bold border-l-2 border-everGold pl-3">Escribe el Riot ID exacto (Usuario#TAG). Se vinculará a Valorant Tracker automáticamente.</p>
                
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6" id="contenedor-titulares">
                    <!-- Se inyecta por JS -->
                </div>
            </div>

            <!-- MÓDULO 03: STAFF Y RESERVAS -->
            <div class="bg-black/60 backdrop-blur-md border border-white/10 p-8 md:p-10 clip-panel shadow-[0_0_40px_rgba(255,42,63,0.05)] relative overflow-hidden">
                <div class="absolute top-0 right-0 bg-vctRed text-white text-[8px] font-black uppercase tracking-widest px-6 py-2 origin-bottom-left transform rotate-45 translate-x-[25px] translate-y-[-15px]">OPCIONAL</div>
                <h2 class="module-header text-xl font-black text-white uppercase tracking-[0.2em] mb-8 pb-4 flex items-center gap-4">
                    <span class="bg-vctRed text-white px-2 py-1 text-xs">03</span> STAFF TÁCTICO Y SUPLENTES
                </h2>
                
                <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                    <div>
                        <label class="text-[9px] text-gray-400 uppercase tracking-[0.2em] mb-3 block font-black flex justify-between">6to Jugador (Suplente) <span class="text-everGold">OPT</span></label>
                        <input type="text" id="jugador_6" placeholder="Jugador#TAG" class="input-vct clip-input w-full p-4 text-xs font-bold text-white border-white/5">
                    </div>
                    <div>
                        <label class="text-[9px] text-gray-400 uppercase tracking-[0.2em] mb-3 block font-black flex justify-between">Head Coach <span class="text-vctRed">OPT</span></label>
                        <input type="text" id="coach" placeholder="Nombre / Alias" class="input-vct clip-input w-full p-4 text-xs font-bold text-white border-white/5">
                    </div>
                    <div>
                        <label class="text-[9px] text-gray-400 uppercase tracking-[0.2em] mb-3 block font-black flex justify-between">Asistente Coach <span class="text-vctRed">OPT</span></label>
                        <input type="text" id="asistente" placeholder="Nombre / Alias" class="input-vct clip-input w-full p-4 text-xs font-bold text-white border-white/5">
                    </div>
                </div>
            </div>

            <button type="submit" id="btn-submit" class="w-full clip-input bg-vctRed text-white font-black text-lg uppercase tracking-[0.4em] py-8 hover:bg-white hover:text-vctRed transition-all duration-300 shadow-[0_0_30px_rgba(255,42,63,0.3)] relative group">
                <span class="relative z-10">ENVIAR REGISTRO AL NEXUS</span>
                <div class="absolute inset-0 bg-white/20 translate-y-full group-hover:translate-y-0 transition-transform duration-300"></div>
            </button>
        </form>
    </div>

    <!-- Toast UI -->
    <div id="toast" class="fixed bottom-6 right-[-400px] z-50 bg-[#0a0a0a] border-l-4 p-4 shadow-2xl flex items-center gap-4 transition-all duration-500 clip-input">
        <div><h4 class="text-white text-[10px] font-black uppercase tracking-widest" id="toast-title">Alerta</h4></div>
    </div>

    <script>
        // Inyectar 5 Titulares
        const contTitulares = document.getElementById('contenedor-titulares');
        for(let i=1; i<=5; i++) {
            contTitulares.innerHTML += `
                <div class="flex items-center">
                    <span class="bg-[#111] text-gray-500 font-black text-xs px-4 py-4 border border-white/10 border-r-0 h-[50px] flex items-center clip-input rounded-l-none">T${i}</span>
                    <input type="text" id="jugador_${i}" required placeholder="Titular ${i} (Riot ID#TAG)" class="input-vct clip-input w-full p-4 h-[50px] text-xs font-bold text-white border-l-0">
                </div>`;
        }

        function showToast(title, isError = false) {
            const t = document.getElementById('toast');
            t.classList.add(isError ? 'border-vctRed' : 'border-everGold');
            document.getElementById('toast-title').innerText = title;
            t.style.right = '24px'; setTimeout(() => { t.style.right = '-400px'; }, 3500);
        }

        document.getElementById('form-registro').addEventListener('submit', async (e) => {
            e.preventDefault(); 
            const btn = document.getElementById('btn-submit').querySelector('span'); 
            btn.innerText = "Sincronizando Base de Datos...";
            
            let jugadores = [];
            
            // 1. Recolectar 5 Titulares
            for(let i=1; i<=5; i++) {
                let id = document.getElementById(`jugador_${i}`).value.trim();
                jugadores.push({ riot_id: id, role: 'TITULAR', tracker_url: `https://tracker.gg/valorant/profile/riot/${encodeURIComponent(id)}/overview` });
            }
            
            // 2. Recolectar Sexto Jugador (Si existe)
            let p6 = document.getElementById('jugador_6').value.trim();
            if(p6) jugadores.push({ riot_id: p6, role: 'SUPLENTE', tracker_url: `https://tracker.gg/valorant/profile/riot/${encodeURIComponent(p6)}/overview` });
            
            // 3. Recolectar Staff (Si existe)
            let coach = document.getElementById('coach').value.trim();
            if(coach) jugadores.push({ riot_id: coach, role: 'COACH', tracker_url: '#' });
            
            let asis = document.getElementById('asistente').value.trim();
            if(asis) jugadores.push({ riot_id: asis, role: 'ASISTENTE COACH', tracker_url: '#' });

            const payload = {
                nombre: document.getElementById('reg_nombre').value,
                discord_capitan: document.getElementById('reg_discord').value,
                rango: "Tracker Activo",
                logo_url: document.getElementById('reg_logo').value,
                jugadores: jugadores
            };

            try {
                const res = await fetch('https://bane-esports-web-1.onrender.com/api/equipos', { 
                    method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) 
                });
                if(res.ok) { 
                    showToast("¡ESCUADRA ACEPTADA! Redirigiendo...", false); 
                    setTimeout(() => window.location.href = 'sorteo.html', 2000); 
                } else showToast("ERROR DE SERVIDOR", true);
            } catch (err) { showToast("SIN CONEXIÓN AL NEXUS", true); } 
            finally { btn.innerText = "ENVIAR REGISTRO AL NEXUS"; }
        });
    </script>
</body>
</html>
