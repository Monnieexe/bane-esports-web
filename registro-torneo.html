<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>5ever | Admisión Oficial</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { theme: { extend: { colors: { vctRed: '#ff2a3f', everGold: '#e5c05c', bgDark: '#0a0a0c' } } } }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Montserrat', sans-serif; background-color: #050505; color: #fff; overflow-x: hidden; }
        
        .bg-pattern {
            position: fixed; inset: 0; z-index: -1;
            background-image: radial-gradient(rgba(255,255,255,0.03) 1px, transparent 1px);
            background-size: 30px 30px;
        }

        .clip-panel { clip-path: polygon(20px 0, 100% 0, 100% calc(100% - 20px), calc(100% - 20px) 100%, 0 100%, 0 20px); }
        .clip-input { clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px); }
        
        .input-vct { 
            background: #0a0a0c; border: 1px solid rgba(255,255,255,0.05); 
            border-left: 2px solid rgba(255,255,255,0.2); transition: all 0.2s ease; 
        }
        .input-vct:focus { 
            border-color: #ff2a3f; border-left-color: #ff2a3f; background: #000;
            outline: none; padding-left: 1.5rem;
        }
        
        /* Estilos de las casillas de rango */
        .rango-cb:checked + div { border-color: #ff2a3f; background: rgba(255,42,63,0.1); color: white; }
        .rango-cb:checked + div span { color: #ff2a3f; }
        
        .module-header { position: relative; overflow: hidden; }
        .module-header::after { content: ''; position: absolute; bottom: 0; left: -100%; width: 50%; height: 2px; background: #ff2a3f; animation: scanline 3s infinite linear; }
        @keyframes scanline { to { left: 200%; } }

        .drop-zone { border: 2px dashed rgba(255,255,255,0.2); transition: all 0.3s ease; }
        .drop-zone:hover, .drop-zone.dragover { border-color: #ff2a3f; background: rgba(255,42,63,0.05); }
    </style>
</head>
<body class="antialiased min-h-screen flex flex-col items-center py-12 px-4 relative">

    <div class="bg-pattern"></div>
    <div class="fixed inset-0 bg-gradient-to-b from-transparent via-[#050505]/80 to-[#050505] z-[-1]"></div>

    <div class="w-full max-w-5xl relative z-10">
        
        <!-- HEADER -->
        <div class="flex justify-between items-end mb-12">
            <div>
                <h1 class="text-5xl md:text-7xl font-black uppercase tracking-tighter text-white mb-2"><span class="text-vctRed">5</span>EVER <span class="text-transparent bg-clip-text bg-gradient-to-r from-everGold to-yellow-700">PORTAL</span></h1>
                <div class="flex items-center gap-3">
                    <div class="w-2 h-2 bg-vctRed rounded-full animate-ping"></div>
                    <p class="text-[10px] text-gray-400 uppercase tracking-[0.4em] font-bold">Inscripción Oficial de Escuadras</p>
                </div>
            </div>
            <a href="sorteo.html" class="hidden md:block text-[10px] font-black text-gray-500 hover:text-white border border-white/10 hover:border-white px-6 py-3 uppercase tracking-widest transition-colors clip-input">
                VOLVER A LA ARENA
            </a>
        </div>

        <form id="form-registro" class="flex flex-col gap-10">
            
            <!-- MÓDULO 01: IDENTIDAD Y RANGOS -->
            <div class="bg-[#050507] border border-white/10 p-8 md:p-10 clip-panel shadow-[0_0_40px_rgba(0,0,0,0.5)]">
                <h2 class="module-header text-xl font-black text-white uppercase tracking-[0.2em] mb-8 pb-4 flex items-center gap-4">
                    <span class="bg-white text-black px-2 py-1 text-xs">01</span> IDENTIDAD DEL EQUIPO
                </h2>
                
                <div class="grid grid-cols-1 md:grid-cols-2 gap-8 mb-8">
                    <div>
                        <label class="text-[9px] text-everGold uppercase tracking-[0.2em] mb-3 block font-black">Nombre de la Escuadra *</label>
                        <input type="text" id="reg_nombre" required placeholder="Ej: 5ever Ignite" class="input-vct clip-input w-full p-4 text-sm font-bold text-white">
                    </div>
                    <div>
                        <label class="text-[9px] text-everGold uppercase tracking-[0.2em] mb-3 block font-black">Discord del Capitán *</label>
                        <input type="text" id="reg_discord" required placeholder="Usuario#0000" class="input-vct clip-input w-full p-4 text-sm font-bold text-white">
                    </div>
                </div>

                <!-- SELECTOR DE RANGOS MÚLTIPLES (CORREGIDO) -->
                <div class="mb-8 border-t border-white/5 pt-8">
                    <label class="text-[9px] text-gray-400 uppercase tracking-[0.2em] mb-4 block font-black border-l-2 border-everGold pl-3">Niveles Competitivos (Selecciona todos los que conformen tu equipo) *</label>
                    <div class="grid grid-cols-2 md:grid-cols-5 gap-3">
                        <label class="cursor-pointer relative">
                            <input type="checkbox" value="Hierro/Bronce" class="rango-cb absolute opacity-0 w-0 h-0">
                            <div class="bg-[#111] border border-white/5 p-4 text-center clip-input hover:border-gray-500 transition-colors h-full flex items-center justify-center">
                                <span class="text-[10px] font-bold uppercase tracking-widest text-gray-400">Hierro / Bronce</span>
                            </div>
                        </label>
                        <label class="cursor-pointer relative">
                            <input type="checkbox" value="Plata/Oro" class="rango-cb absolute opacity-0 w-0 h-0">
                            <div class="bg-[#111] border border-white/5 p-4 text-center clip-input hover:border-gray-500 transition-colors h-full flex items-center justify-center">
                                <span class="text-[10px] font-bold uppercase tracking-widest text-gray-400">Plata / Oro</span>
                            </div>
                        </label>
                        <label class="cursor-pointer relative">
                            <input type="checkbox" value="Platino/Diamante" class="rango-cb absolute opacity-0 w-0 h-0">
                            <div class="bg-[#111] border border-white/5 p-4 text-center clip-input hover:border-gray-500 transition-colors h-full flex items-center justify-center">
                                <span class="text-[10px] font-bold uppercase tracking-widest text-gray-400">Platino / Diamante</span>
                            </div>
                        </label>
                        <label class="cursor-pointer relative">
                            <input type="checkbox" value="Ascendente/Inmortal" class="rango-cb absolute opacity-0 w-0 h-0">
                            <div class="bg-[#111] border border-white/5 p-4 text-center clip-input hover:border-gray-500 transition-colors h-full flex items-center justify-center">
                                <span class="text-[10px] font-bold uppercase tracking-widest text-gray-400">Ascendente / Inmortal</span>
                            </div>
                        </label>
                        <label class="cursor-pointer relative">
                            <input type="checkbox" value="Inmortal/Radiante" class="rango-cb absolute opacity-0 w-0 h-0">
                            <div class="bg-[#111] border border-white/5 p-4 text-center clip-input hover:border-gray-500 transition-colors h-full flex items-center justify-center">
                                <span class="text-[10px] font-bold uppercase tracking-widest text-gray-400">Inmortal / Radiante</span>
                            </div>
                        </label>
                    </div>
                </div>

                <!-- ZONA DE ARRASTRAR IMAGEN -->
                <div>
                    <label class="text-[9px] text-gray-400 uppercase tracking-[0.2em] mb-3 block font-black">Emblema Oficial (Arrastra tu imagen) *</label>
                    <div id="drop-area" class="drop-zone bg-[#0a0a0c] clip-input p-10 text-center cursor-pointer relative group flex flex-col items-center justify-center min-h-[200px]">
                        <input type="file" id="file-input" accept="image/*" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer z-30">
                        
                        <div id="upload-content" class="pointer-events-none flex flex-col items-center z-10 transition-opacity">
                            <svg class="w-12 h-12 mb-4 text-gray-600 group-hover:text-vctRed transition-colors" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"></path></svg>
                            <p id="file-name" class="text-sm font-bold text-white uppercase tracking-widest">Arrastra tu logo aquí o haz clic</p>
                            <p class="text-[9px] text-gray-500 mt-2 uppercase tracking-[0.2em]">Soporta PNG o JPG (Max 5MB)</p>
                        </div>

                        <img id="image-preview" src="" class="hidden absolute inset-0 w-full h-full object-contain bg-[#0a0a0c] p-4 z-20 pointer-events-none">
                    </div>
                </div>
            </div>

            <!-- MÓDULO 02: ROSTER TITULAR CON DISCORD -->
            <div class="bg-[#050507] border border-white/10 p-8 md:p-10 clip-panel shadow-[0_0_40px_rgba(0,0,0,0.5)]">
                <h2 class="module-header text-xl font-black text-white uppercase tracking-[0.2em] mb-2 pb-4 flex items-center gap-4">
                    <span class="bg-everGold text-black px-2 py-1 text-xs">02</span> ROSTER TITULAR
                </h2>
                <p class="text-[10px] text-gray-500 uppercase tracking-widest mb-8 font-bold border-l-2 border-everGold pl-3">Escribe el Riot ID exacto y la etiqueta de Discord de los 5 titulares.</p>
                
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6" id="contenedor-titulares">
                    <!-- JS inyecta los 5 inputs agrupados -->
                </div>
            </div>

            <!-- MÓDULO 03: STAFF Y RESERVAS (MANAGER INCLUIDO) -->
            <div class="bg-[#050507] border border-white/10 p-8 md:p-10 clip-panel shadow-[0_0_40px_rgba(255,42,63,0.05)] relative overflow-hidden">
                <div class="absolute top-0 right-0 bg-vctRed text-white text-[8px] font-black uppercase tracking-widest px-6 py-2 origin-bottom-left transform rotate-45 translate-x-[25px] translate-y-[-15px]">OPCIONAL</div>
                <h2 class="module-header text-xl font-black text-white uppercase tracking-[0.2em] mb-8 pb-4 flex items-center gap-4">
                    <span class="bg-vctRed text-white px-2 py-1 text-xs">03</span> STAFF TÁCTICO Y SUPLENTES
                </h2>
                
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    
                    <div class="bg-black p-4 border border-white/5 clip-input">
                        <label class="text-[9px] text-gray-400 uppercase tracking-[0.2em] mb-4 block font-black border-b border-white/10 pb-2">6to Jugador (Suplente)</label>
                        <div class="flex flex-col gap-3">
                            <input type="text" id="jugador_6" placeholder="Riot ID#TAG" class="input-vct w-full p-3 text-xs font-bold text-white border-white/5">
                            <input type="text" id="jugador_6_dc" placeholder="Discord Suplente" class="input-vct w-full p-3 text-xs font-bold text-white border-white/5">
                        </div>
                    </div>

                    <div class="bg-black p-4 border border-white/5 clip-input">
                        <label class="text-[9px] text-gray-400 uppercase tracking-[0.2em] mb-4 block font-black border-b border-white/10 pb-2">Head Coach</label>
                        <div class="flex flex-col gap-3">
                            <input type="text" id="coach" placeholder="Nombre / Alias" class="input-vct w-full p-3 text-xs font-bold text-white border-white/5">
                            <input type="text" id="coach_dc" placeholder="Discord Coach" class="input-vct w-full p-3 text-xs font-bold text-white border-white/5">
                        </div>
                    </div>

                    <div class="bg-black p-4 border border-white/5 clip-input">
                        <label class="text-[9px] text-gray-400 uppercase tracking-[0.2em] mb-4 block font-black border-b border-white/10 pb-2">Asistente Coach</label>
                        <div class="flex flex-col gap-3">
                            <input type="text" id="asistente" placeholder="Nombre / Alias" class="input-vct w-full p-3 text-xs font-bold text-white border-white/5">
                            <input type="text" id="asistente_dc" placeholder="Discord Asistente" class="input-vct w-full p-3 text-xs font-bold text-white border-white/5">
                        </div>
                    </div>

                    <div class="bg-black p-4 border border-white/5 clip-input">
                        <label class="text-[9px] text-gray-400 uppercase tracking-[0.2em] mb-4 block font-black border-b border-white/10 pb-2">Team Manager</label>
                        <div class="flex flex-col gap-3">
                            <input type="text" id="manager" placeholder="Nombre / Alias" class="input-vct w-full p-3 text-xs font-bold text-white border-white/5">
                            <input type="text" id="manager_dc" placeholder="Discord Manager" class="input-vct w-full p-3 text-xs font-bold text-white border-white/5">
                        </div>
                    </div>

                </div>
            </div>

            <button type="submit" id="btn-submit" class="w-full clip-input bg-vctRed text-white font-black text-lg uppercase tracking-[0.4em] py-8 hover:bg-white hover:text-vctRed transition-all duration-300 shadow-[0_0_30px_rgba(255,42,63,0.3)] relative group">
                <span class="relative z-10" id="btn-text">ENVIAR REGISTRO AL NEXUS</span>
            </button>
        </form>
    </div>

    <!-- Toast UI -->
    <div id="toast" class="fixed bottom-6 right-[-400px] z-50 bg-[#0a0a0a] border-l-4 p-4 flex items-center gap-4 transition-all duration-300 clip-input">
        <div><h4 class="text-white text-[10px] font-black uppercase tracking-widest" id="toast-title">Alerta</h4></div>
    </div>

    <script>
        const contTitulares = document.getElementById('contenedor-titulares');
        for(let i=1; i<=5; i++) {
            contTitulares.innerHTML += `
                <div class="bg-black p-5 border border-white/5 clip-input hover:border-vctRed transition-colors">
                    <span class="text-[10px] text-everGold font-black uppercase tracking-widest mb-4 block border-b border-white/10 pb-2">TITULAR 0${i}</span>
                    <div class="flex flex-col gap-3">
                        <div class="flex items-center">
                            <span class="bg-[#111] text-gray-500 font-black text-xs px-3 py-3 border border-white/10 border-r-0 h-[40px] flex items-center clip-input rounded-l-none w-10 justify-center">ID</span>
                            <input type="text" id="jugador_${i}" required placeholder="Riot ID#TAG" class="input-vct clip-input w-full p-3 h-[40px] text-xs font-bold text-white border-l-0">
                        </div>
                        <div class="flex items-center">
                            <span class="bg-[#111] text-vctRed font-black text-xs px-3 py-3 border border-white/10 border-r-0 h-[40px] flex items-center clip-input rounded-l-none w-10 justify-center">DC</span>
                            <input type="text" id="jugador_${i}_dc" required placeholder="Discord Usuario#0000" class="input-vct clip-input w-full p-3 h-[40px] text-xs font-bold text-white border-l-0">
                        </div>
                    </div>
                </div>`;
        }

        function showToast(title, isError = false) {
            const t = document.getElementById('toast');
            t.className = `fixed bottom-6 right-[-400px] z-50 bg-[#0a0a0a] border-l-4 p-4 flex items-center gap-4 transition-all duration-300 clip-input ${isError ? 'border-vctRed' : 'border-everGold'}`;
            document.getElementById('toast-title').innerText = title;
            t.style.right = '24px'; setTimeout(() => { t.style.right = '-400px'; }, 3500);
        }

        const dropArea = document.getElementById('drop-area');
        const fileInput = document.getElementById('file-input');
        const preview = document.getElementById('image-preview');
        const uploadContent = document.getElementById('upload-content');
        let selectedFile = null;

        ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => { dropArea.addEventListener(eventName, preventDefaults, false); });
        function preventDefaults(e) { e.preventDefault(); e.stopPropagation(); }
        ['dragenter', 'dragover'].forEach(eventName => { dropArea.addEventListener(eventName, () => dropArea.classList.add('dragover'), false); });
        ['dragleave', 'drop'].forEach(eventName => { dropArea.addEventListener(eventName, () => dropArea.classList.remove('dragover'), false); });

        dropArea.addEventListener('drop', (e) => handleFiles(e.dataTransfer.files), false);
        fileInput.addEventListener('change', (e) => handleFiles(e.target.files), false);

        function handleFiles(files) {
            if (files.length && files[0].type.startsWith('image/')) {
                selectedFile = files[0];
                const reader = new FileReader();
                reader.onload = (e) => {
                    preview.src = e.target.result;
                    preview.classList.remove('hidden');
                    uploadContent.style.opacity = '0';
                }
                reader.readAsDataURL(selectedFile);
            } else {
                showToast("Por favor, sube solo imágenes.", true);
            }
        }

        document.getElementById('form-registro').addEventListener('submit', async (e) => {
            e.preventDefault(); 
            
            // 0. Validaciones Previas
            if (!selectedFile) { showToast("Debes subir un emblema (logo).", true); return; }
            
            // Revisar qué rangos seleccionaron
            let rangosSeleccionados = [];
            document.querySelectorAll('.rango-cb:checked').forEach(cb => rangosSeleccionados.push(cb.value));
            
            if (rangosSeleccionados.length === 0) { 
                showToast("Selecciona al menos un rango competitivo.", true); return; 
            }

            const btnText = document.getElementById('btn-text'); 
            btnText.innerText = "Sincronizando Sistema...";
            let logoGenerado = "";

            // 1. SUBIR LA IMAGEN A IMGBB
            btnText.innerText = "SUBIENDO EMBLEMA...";
            const formData = new FormData();
            formData.append('image', selectedFile);
            
            try {
                // ==========================================
                // ⚠️ PON TU API KEY DE IMGBB AQUÍ ABAJO ⚠️
                // ==========================================
                const apiKey = 'TU_API_KEY_AQUI'; 
                const imgRes = await fetch(`https://api.imgbb.com/1/upload?key=${apiKey}`, {
                    method: 'POST', body: formData
                });
                const imgData = await imgRes.json();
                if(imgData.success) { logoGenerado = imgData.data.url; } 
                else { showToast("Error al procesar la imagen.", true); btnText.innerText = "ENVIAR REGISTRO AL NEXUS"; return; }
            } catch(err) {
                showToast("Error de conexión con el servidor de imágenes.", true);
                btnText.innerText = "ENVIAR REGISTRO AL NEXUS"; return;
            }
            
            let jugadores = [];
            
            // Titulares
            for(let i=1; i<=5; i++) {
                let id = document.getElementById(`jugador_${i}`).value.trim();
                let dc = document.getElementById(`jugador_${i}_dc`).value.trim();
                jugadores.push({ riot_id: id, dc: dc, role: 'TITULAR', tracker_url: `https://tracker.gg/valorant/profile/riot/${encodeURIComponent(id)}/overview` });
            }
            
            // Suplente y Staff
            let p6 = document.getElementById('jugador_6').value.trim(); let p6_dc = document.getElementById('jugador_6_dc').value.trim();
            if(p6) jugadores.push({ riot_id: p6, dc: p6_dc, role: 'SUPLENTE', tracker_url: `https://tracker.gg/valorant/profile/riot/${encodeURIComponent(p6)}/overview` });
            
            let coach = document.getElementById('coach').value.trim(); let coach_dc = document.getElementById('coach_dc').value.trim();
            if(coach) jugadores.push({ riot_id: coach, dc: coach_dc, role: 'COACH', tracker_url: '#' });
            
            let asis = document.getElementById('asistente').value.trim(); let asis_dc = document.getElementById('asistente_dc').value.trim();
            if(asis) jugadores.push({ riot_id: asis, dc: asis_dc, role: 'ASISTENTE COACH', tracker_url: '#' });

            let manager = document.getElementById('manager').value.trim(); let manager_dc = document.getElementById('manager_dc').value.trim();
            if(manager) jugadores.push({ riot_id: manager, dc: manager_dc, role: 'MANAGER', tracker_url: '#' });

            const payload = {
                nombre: document.getElementById('reg_nombre').value,
                discord_capitan: document.getElementById('reg_discord').value,
                rango: rangosSeleccionados.join(' / '), 
                logo_url: logoGenerado, 
                jugadores: jugadores
            };

            // 3. ENVIAR A LA BASE DE DATOS
            try {
                btnText.innerText = "INSERTANDO DATOS...";
                const res = await fetch('https://bane-esports-web-1.onrender.com/api/equipos', { 
                    method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) 
                });
                if(res.ok) { 
                    showToast("¡ESCUADRA ACEPTADA! Redirigiendo...", false); 
                    setTimeout(() => window.location.href = 'sorteo.html', 2000); 
                } else showToast("Error en el servidor de Render", true);
            } catch (err) { showToast("Sin conexión al Nexus", true); } 
            finally { if(btnText.innerText !== "¡ESCUADRA ACEPTADA! Redirigiendo...") btnText.innerText = "ENVIAR REGISTRO AL NEXUS"; }
        });
    </script>
</body>
</html>
