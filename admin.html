<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>5ever | Centro de Control</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { theme: { extend: { colors: { vctRed: '#ff2a3f', everGold: '#e5c05c', bgDark: '#050507' } } } }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Montserrat', sans-serif; background-color: #030303; color: white; background-image: radial-gradient(circle at 100% 0%, rgba(255,42,63,0.05) 0%, transparent 50%); }
        .tab-content { display: none; } 
        .tab-content.active { display: block; animation: slideIn 0.3s ease-out; }
        @keyframes slideIn { from { opacity: 0; transform: translateX(-10px); } to { opacity: 1; transform: translateX(0); } }
        .tab-btn { opacity: 0.5; transition: all 0.3s; } 
        .tab-btn.active { opacity: 1; border-bottom: 2px solid #ff2a3f; color: white; }
        .input-admin { background: rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.1); border-left: 2px solid #333; transition: all 0.2s; }
        .input-admin:focus { border-color: #e5c05c; border-left-color: #e5c05c; outline: none; background: #0a0a0a; }
        #toast { position: fixed; top: 20px; right: -400px; transition: right 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); z-index: 100; }
    </style>
</head>
<body class="antialiased p-4 md:p-8 min-h-screen">

    <div class="max-w-6xl mx-auto">
        <div class="flex justify-between items-center mb-8 border-b border-white/5 pb-6">
            <div>
                <h1 class="text-3xl font-black uppercase tracking-tighter text-white"><span class="text-vctRed">5</span>EVER <span class="text-gray-700">SYS_ADMIN</span></h1>
                <p class="text-[9px] text-vctRed uppercase tracking-[0.4em] font-bold mt-1 flex items-center gap-2">
                    <span class="w-1.5 h-1.5 bg-vctRed rounded-full animate-ping"></span> Acceso Clasificado (VIP Activo)
                </p>
            </div>
            <button onclick="cerrarSesion()" class="text-[9px] font-bold text-gray-500 hover:text-white border border-white/10 hover:border-vctRed hover:bg-vctRed px-4 py-2 transition-all">SALIR</button>
        </div>

        <div class="flex gap-8 mb-8 border-b border-white/5 pb-0">
            <button onclick="switchTab('tab-equipos')" id="btn-tab-equipos" class="tab-btn active text-[10px] font-black uppercase tracking-[0.2em] pb-3 text-white">Data: Equipos</button>
            <button onclick="switchTab('tab-bracket')" id="btn-tab-bracket" class="tab-btn text-[10px] font-black uppercase tracking-[0.2em] pb-3 text-white">Consola de Cruces</button>
        </div>

        <div id="tab-equipos" class="tab-content active bg-black/60 border border-white/5 p-6 shadow-2xl backdrop-blur-sm">
            <div class="flex justify-between items-center mb-6 pb-4 border-b border-white/5">
                <h2 class="text-xl font-black text-white uppercase tracking-widest">Base de Datos de Equipos</h2>
                <span id="contador-equipos" class="bg-[#111] border border-white/10 text-white text-[10px] font-bold px-4 py-2 uppercase tracking-widest">0 EN SISTEMA</span>
            </div>
            <div class="flex flex-col gap-3" id="lista-equipos-admin"></div>
        </div>

        <div id="tab-bracket" class="tab-content">
            <div class="bg-black/60 border border-white/5 p-6 md:p-8 mb-6 shadow-2xl backdrop-blur-sm">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-6">
                    <div>
                        <label class="text-[9px] text-everGold uppercase tracking-[0.2em] mb-2 block font-bold">Designación de Fase</label>
                        <input type="text" id="sorteo_fase" placeholder="Ej: Cuartos de Final" class="input-admin w-full p-4 text-xs text-white font-bold">
                    </div>
                    <div>
                        <label class="text-[9px] text-everGold uppercase tracking-[0.2em] mb-2 block font-bold">Estado del Combate</label>
                        <select id="sorteo_status" class="input-admin w-full p-4 text-xs text-white font-bold">
                            <option value="pending">STANDBY (VS)</option>
                            <option value="eq1">VICTORIA EQ 1</option>
                            <option value="eq2">VICTORIA EQ 2</option>
                        </select>
                    </div>
                </div>
                <div class="grid grid-cols-1 md:grid-cols-12 gap-4 items-end bg-[#050505] p-6 border border-white/5">
                    <div class="md:col-span-4">
                        <label class="text-[9px] text-gray-500 uppercase tracking-widest mb-2 block font-bold">Equipo 1</label>
                        <select id="sorteo_eq1" class="input-admin w-full p-4 text-xs text-white font-bold"></select>
                    </div>
                    <div class="md:col-span-2">
                        <label class="text-[9px] text-gray-500 uppercase tracking-widest mb-2 block font-bold text-center">Pts Eq 1</label>
                        <input type="number" id="sorteo_score1" placeholder="-" class="input-admin w-full p-4 text-xs text-center font-black text-vctRed text-lg">
                    </div>
                    <div class="md:col-span-2">
                        <label class="text-[9px] text-gray-500 uppercase tracking-widest mb-2 block font-bold text-center">Pts Eq 2</label>
                        <input type="number" id="sorteo_score2" placeholder="-" class="input-admin w-full p-4 text-xs text-center font-black text-vctRed text-lg">
                    </div>
                    <div class="md:col-span-4">
                        <label class="text-[9px] text-gray-500 uppercase tracking-widest mb-2 block font-bold">Equipo 2</label>
                        <select id="sorteo_eq2" class="input-admin w-full p-4 text-xs text-white font-bold"></select>
                    </div>
                </div>
                <button onclick="agregarMatchSorteo()" class="w-full mt-6 border border-white/10 text-gray-400 hover:text-white font-black text-[10px] uppercase tracking-[0.3em] p-4 hover:border-everGold transition-colors">
                    INYECTAR A LA LISTA LOCAL
                </button>
            </div>
            
            <div class="bg-[#050505] border border-white/5 p-6 mb-6">
                <h3 class="text-[9px] text-gray-500 font-bold uppercase tracking-widest mb-4">Buffer Local (No visible en la Arena)</h3>
                <div id="lista-sorteo-admin" class="flex flex-col gap-2"></div>
            </div>
            
            <button onclick="publicarSorteo()" class="w-full bg-vctRed text-white font-black text-sm uppercase tracking-[0.4em] p-6 hover:bg-white hover:text-vctRed transition-colors shadow-[0_0_30px_rgba(255,42,63,0.3)]">
                SINCRONIZAR A LA BASE DE DATOS MUNDIAL
            </button>
        </div>
    </div>

    <div id="toast" class="bg-[#0a0a0a] border-l-4 border-everGold p-4 shadow-2xl flex items-center gap-4">
        <div class="text-everGold font-black">!</div>
        <div><h4 class="text-white text-[10px] font-black uppercase tracking-widest" id="toast-title">Alerta</h4></div>
    </div>

    <script>
        const API_URL = 'https://bane-esports-web-1.onrender.com/api';
        let bracketMatches = []; 
        let bracketNoticiaId = null;
        let equipoActualizando = null;

        document.addEventListener('DOMContentLoaded', () => {
            localStorage.setItem('idToken', 'pase-vip-temporal-5ever');
            cargarEquiposInscritos(); 
            cargarDatosSorteo();
        });

        function getAuthHeaders() { 
            return { 
                'Content-Type': 'application/json', 
                'Authorization': `Bearer ${localStorage.getItem('idToken')}` 
            }; 
        }

        function cerrarSesion() { 
            localStorage.removeItem('idToken'); 
            window.location.href = 'login.html'; 
        }

        function switchTab(t) { 
            document.querySelectorAll('.tab-content, .tab-btn').forEach(e => e.classList.remove('active')); 
            document.getElementById(t).classList.add('active'); 
            document.getElementById('btn-'+t).classList.add('active'); 
        }

        function showToast(title, isError = false) {
            const t = document.getElementById('toast'); 
            t.className = `fixed top-6 z-50 bg-[#0a0a0a] border-l-4 ${isError ? 'border-vctRed' : 'border-everGold'} p-4 shadow-2xl flex items-center gap-4 right-[-400px]`;
            document.getElementById('toast-title').innerText = title;
            t.style.right = '24px';
            setTimeout(() => { t.style.right = '-400px'; }, 3000);
        }

        // CARGA Y GESTIÓN DE EQUIPOS
        async function cargarEquiposInscritos() {
            try {
                const res = await fetch(`${API_URL}/equipos`); 
                const equipos = await res.json();
                document.getElementById('contador-equipos').innerText = `${equipos.length} EN SISTEMA`;
                const lista = document.getElementById('lista-equipos-admin'); 
                lista.innerHTML = '';
                
                equipos.forEach((eq, idx) => {
                    let rosterHtml = '';
                    if(eq.jugadores && eq.jugadores.length > 0) {
                        rosterHtml = `<div id="admin-roster-${idx}" class="hidden mt-4 pt-4 border-t border-white/5 grid grid-cols-1 md:grid-cols-2 gap-2">`;
                        eq.jugadores.forEach(j => {
                            let dcBadge = j.dc ? `<span class="text-everGold ml-2 block sm:inline font-bold">DC: ${j.dc}</span>` : '';
                            let roleBadge = j.role ? `<span class="text-gray-400 mr-2 font-black">[${j.role}]</span>` : '';
                            rosterHtml += `<div class="bg-[#111] p-2.5 px-3 border-l-2 border-vctRed text-[10px] font-bold text-white uppercase">${roleBadge} ${j.riot_id} ${dcBadge}</div>`;
                        });
                        rosterHtml += `</div>`;
                    }

                    let rangoInfo = eq.rango ? `<span class="text-[9px] text-gray-400 block mt-1 uppercase tracking-widest font-bold">Rangos: ${eq.rango}</span>` : '';
                    let discordCap = eq.discord ? `<span class="text-[9px] text-everGold block uppercase tracking-widest font-bold">Capitán: ${eq.discord}</span>` : '';

                    lista.innerHTML += `
                        <div class="bg-[#050505] border border-white/5 p-4 flex flex-col hover:border-white/20 transition-colors mb-2">
                            <div class="flex items-center justify-between">
                                <div class="flex items-center gap-4 cursor-pointer flex-1" onclick="document.getElementById('admin-roster-${idx}').classList.toggle('hidden')">
                                    <div>
                                        <span class="text-sm font-black text-white uppercase tracking-widest">${eq.nombre}</span>
                                        ${discordCap}
                                        ${rangoInfo}
                                    </div>
                                    <span class="text-[9px] text-everGold uppercase tracking-widest border border-white/10 px-2 py-1 ml-2 font-bold">VER ROSTER ▼</span>
                                </div>
                                <div class="flex gap-4 items-center">
                                    <button onclick='abrirModalEdicion(${JSON.stringify(eq).replace(/'/g, "&apos;")})' class="text-everGold hover:text-white text-xs font-black uppercase tracking-wider">✎ EDITAR</button>
                                    <button onclick="borrarEquipoInscrito('${eq.id}')" class="text-gray-600 hover:text-vctRed text-xs font-black uppercase tracking-wider">X PURGAR</button>
                                </div>
                            </div>
                            ${rosterHtml}
                        </div>`;
                });
            } catch (e) {
                console.error("Error al cargar equipos:", e);
            }
        }

        // VENTANA MODAL PARA EDITAR EL ROSTER
        function abrirModalEdicion(equipo) {
            equipoActualizando = JSON.parse(JSON.stringify(equipo));
            let rosterInputsHTML = '';

            equipoActualizando.jugadores.forEach((j, i) => {
                rosterInputsHTML += `
                    <div class="flex flex-col sm:flex-row gap-2 mb-3 bg-[#111] p-3 border border-white/5">
                        <input type="text" id="edit_role_${i}" value="${j.role || ''}" placeholder="Rol" class="bg-black text-everGold p-2 text-xs w-full sm:w-32 border border-white/10 font-bold uppercase">
                        <input type="text" id="edit_id_${i}" value="${j.riot_id || ''}" placeholder="Riot ID#TAG" class="bg-black text-white p-2 text-xs flex-1 border border-white/10 font-bold">
                        <input type="text" id="edit_dc_${i}" value="${j.dc || ''}" placeholder="Discord" class="bg-black text-white p-2 text-xs w-full sm:w-36 border border-white/10 font-bold">
                    </div>`;
            });

            const modal = document.createElement('div');
            modal.id = 'modal-edicion';
            modal.className = 'fixed inset-0 bg-black/90 z-50 flex items-center justify-center p-4';
            modal.innerHTML = `
                <div class="bg-[#050505] border border-white/10 p-6 md:p-8 w-full max-w-3xl max-h-[90vh] overflow-y-auto">
                    <h3 class="text-vctRed font-black uppercase text-xl mb-4 tracking-wider">Modificar Escuadra</h3>
                    
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
                        <div>
                            <label class="text-[9px] text-gray-400 uppercase font-black mb-1 block">Nombre de Escuadra</label>
                            <input type="text" id="edit_nombre" value="${equipoActualizando.nombre}" class="input-admin w-full p-3 text-xs text-white font-bold">
                        </div>
                        <div>
                            <label class="text-[9px] text-gray-400 uppercase font-black mb-1 block">Discord del Capitán</label>
                            <input type="text" id="edit_capitan" value="${equipoActualizando.discord || ''}" class="input-admin w-full p-3 text-xs text-white font-bold">
                        </div>
                    </div>

                    <div class="mb-6">
                        <label class="text-[9px] text-gray-400 uppercase font-black mb-1 block">Rangos Declarados</label>
                        <input type="text" id="edit_rango" value="${equipoActualizando.rango || ''}" class="input-admin w-full p-3 text-xs text-white font-bold">
                    </div>

                    <h4 class="text-everGold text-xs font-black uppercase tracking-widest mb-3">Integrantes del Roster</h4>
                    ${rosterInputsHTML}

                    <div class="flex justify-end gap-4 mt-8 pt-4 border-t border-white/5">
                        <button onclick="document.getElementById('modal-edicion').remove()" class="text-gray-500 hover:text-white text-xs font-bold uppercase tracking-widest px-4 py-2">CANCELAR</button>
                        <button onclick="guardarEdicionEquipo()" class="bg-everGold text-black font-black text-xs uppercase tracking-widest px-6 py-3 hover:bg-white transition-colors">GUARDAR CAMBIOS</button>
                    </div>
                </div>`;
            document.body.appendChild(modal);
        }

        async function guardarEdicionEquipo() {
            equipoActualizando.nombre = document.getElementById('edit_nombre').value.trim();
            equipoActualizando.discord = document.getElementById('edit_capitan').value.trim();
            equipoActualizando.rango = document.getElementById('edit_rango').value.trim();

            equipoActualizando.jugadores.forEach((j, i) => {
                j.role = document.getElementById(`edit_role_${i}`).value.trim();
                j.riot_id = document.getElementById(`edit_id_${i}`).value.trim();
                j.dc = document.getElementById(`edit_dc_${i}`).value.trim();
                if(j.role !== 'HEAD COACH' && j.role !== 'ASISTENTE COACH' && j.role !== 'TEAM MANAGER') {
                    j.tracker_url = `https://tracker.gg/valorant/profile/riot/${encodeURIComponent(j.riot_id)}/overview`;
                }
            });

            try {
                const res = await fetch(`${API_URL}/equipos`, {
                    method: 'PUT',
                    headers: getAuthHeaders(),
                    body: JSON.stringify(equipoActualizando)
                });
                if(res.ok) {
                    showToast("Equipo actualizado correctamente");
                    document.getElementById('modal-edicion').remove();
                    cargarEquiposInscritos();
                    cargarDatosSorteo();
                } else {
                    showToast("Error al guardar cambios", true);
                }
            } catch (err) {
                showToast("Fallo de red al editar", true);
            }
        }

        async function borrarEquipoInscrito(id) { 
            if(confirm("⚠ ¿Seguro que deseas eliminar este equipo del torneo?")) { 
                await fetch(`${API_URL}/equipos?id=${id}`, { method: 'DELETE', headers: getAuthHeaders() }); 
                cargarEquiposInscritos(); 
                cargarDatosSorteo(); 
                showToast("Equipo purgado del sistema"); 
            } 
        }

        // CARGA Y GESTIÓN DE BRACKETS
        async function cargarDatosSorteo() {
            try {
                const res = await fetch(`${API_URL}/equipos`); 
                const equipos = await res.json();
                let opts = '<option value="">-- SELECCIONAR --</option>'; 
                equipos.forEach(e => { opts += `<option value="${e.nombre}">${e.nombre}</option>`; });
                document.getElementById('sorteo_eq1').innerHTML = opts; 
                document.getElementById('sorteo_eq2').innerHTML = opts + '<option value="BYE">PASO DIRECTO (BYE)</option>';
                
                const resNot = await fetch(`${API_URL}/noticias`);
                const noticias = await resNot.json();
                const bd = noticias.find(n => n.titulo === '[BRACKET_DATA]');
                bracketMatches = bd ? JSON.parse(bd.descripcion) : []; 
                bracketNoticiaId = bd ? bd.id : null;
                renderListaSorteo();
            } catch (e) {}
        }

        function renderListaSorteo() {
            const lista = document.getElementById('lista-sorteo-admin'); 
            lista.innerHTML = '';
            bracketMatches.forEach((m, i) => {
                let st = m.status === 'pending' ? 'VS' : 'WIN';
                lista.innerHTML += `
                    <div class="flex items-center justify-between border-b border-white/5 py-3 text-[10px] uppercase tracking-widest text-gray-400 font-bold">
                        <div class="flex gap-4 items-center">
                            <span class="text-white w-24 truncate">${m.fase}</span>
                            <span>${m.eq1} <b class="text-vctRed mx-1">x</b> ${m.eq2}</span>
                            <span class="text-everGold ml-4">${st} [${m.score1||'-'}:${m.score2||'-'}]</span>
                        </div>
                        <button onclick="borrarMatch(${i})" class="text-gray-600 hover:text-vctRed text-sm font-black">✕</button>
                    </div>`;
            });
        }

        function agregarMatchSorteo() {
            const m = { 
                fase: document.getElementById('sorteo_fase').value, 
                eq1: document.getElementById('sorteo_eq1').value, 
                eq2: document.getElementById('sorteo_eq2').value, 
                score1: document.getElementById('sorteo_score1').value, 
                score2: document.getElementById('sorteo_score2').value, 
                status: document.getElementById('sorteo_status').value 
            };
            if(!m.fase || !m.eq1 || !m.eq2) return showToast("Completa los campos del match", true);
            bracketMatches.push(m); 
            document.getElementById('sorteo_score1').value = ''; 
            document.getElementById('sorteo_score2').value = ''; 
            renderListaSorteo(); 
            showToast("Match agregado a la lista local");
        }
        
        function borrarMatch(i) { 
            bracketMatches.splice(i, 1); 
            renderListaSorteo(); 
        }

        async function publicarSorteo() {
            const b = document.querySelector('button[onclick="publicarSorteo()"]'); 
            const originalText = b.innerText; 
            b.innerText = "SINCRONIZANDO...";
            try {
                if(bracketNoticiaId) {
                    await fetch(`${API_URL}/noticias?id=${bracketNoticiaId}`, { method: 'DELETE', headers: getAuthHeaders() });
                }
                const res = await fetch(`${API_URL}/noticias`, { 
                    method: 'POST', 
                    headers: getAuthHeaders(), 
                    body: JSON.stringify({ titulo: '[BRACKET_DATA]', descripcion: JSON.stringify(bracketMatches), imagen_url: 'HIDDEN' }) 
                });
                if(res.ok) { 
                    showToast("Arena Sincronizada Exitosamente"); 
                    cargarDatosSorteo(); 
                } else {
                    showToast("Error al publicar datos del torneo", true);
                }
            } catch(e) { 
                showToast("Fallo de conexión", true); 
            } finally { 
                b.innerText = originalText; 
            }
        }
    </script>
</body>
</html>
