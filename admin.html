<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Comando | Bane Esports</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { theme: { extend: { colors: { baneAccent: '#ff4655' } } } }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Montserrat', sans-serif; background-color: #050505; color: white; }
        .font-heading { font-family: 'Cinzel', serif; }
        .tab-content { display: none; }
        .tab-content.active { display: block; animation: fadeIn 0.4s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
        .tab-btn.active { border-bottom: 2px solid #ff4655; color: #ff4655; }
    </style>
</head>
<body class="antialiased p-8">

    <div class="max-w-6xl mx-auto">
        <div class="flex justify-between items-end mb-6 border-b border-white/10 pb-6">
            <div>
                <h1 class="font-heading text-4xl text-white font-black tracking-widest"><span class="text-baneAccent">B</span> ADMIN <span class="text-gray-600">NEXUS</span></h1>
                <p class="text-xs text-gray-500 uppercase tracking-widest mt-2">Centro de Control Oficial</p>
            </div>
            <button onclick="cerrarSesion()" class="text-xs font-bold text-gray-400 hover:text-baneAccent uppercase tracking-widest transition-colors">Cerrar Sesión</button>
        </div>

        <div class="flex gap-6 mb-8 border-b border-white/5 pb-2">
            <button onclick="switchTab('tab-bracket')" id="btn-tab-bracket" class="tab-btn active text-xs font-bold uppercase tracking-widest pb-2 text-gray-400 hover:text-white transition-colors">Sorteo (Bracket)</button>
            <button onclick="switchTab('tab-matches')" id="btn-tab-matches" class="tab-btn text-xs font-bold uppercase tracking-widest pb-2 text-gray-400 hover:text-white transition-colors">Matches BANE</button>
            <button onclick="switchTab('tab-noticias')" id="btn-tab-noticias" class="tab-btn text-xs font-bold uppercase tracking-widest pb-2 text-gray-400 hover:text-white transition-colors">Noticias</button>
        </div>

        <div id="tab-bracket" class="tab-content active bg-black border border-baneAccent/50 p-8 rounded-sm shadow-[0_0_20px_rgba(255,70,85,0.1)]">
            <h2 class="font-heading text-2xl text-white font-bold uppercase tracking-widest mb-6 border-l-4 border-baneAccent pl-3">Gestor de Torneo</h2>
            
            <div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-6">
                <div>
                    <label class="text-[9px] text-gray-500 uppercase tracking-widest mb-1 block">Nombre de la Fase</label>
                    <input type="text" id="sorteo_fase" placeholder="Ej: Ronda 2 - Winner" class="w-full bg-[#111] border border-white/10 p-3 text-xs text-white focus:border-baneAccent outline-none">
                </div>
                <div>
                    <label class="text-[9px] text-gray-500 uppercase tracking-widest mb-1 block">Equipo 1</label>
                    <select id="sorteo_eq1" class="w-full bg-[#111] border border-white/10 p-3 text-xs text-white focus:border-baneAccent outline-none cursor-pointer"></select>
                </div>
                <div>
                    <label class="text-[9px] text-gray-500 uppercase tracking-widest mb-1 block">Equipo 2</label>
                    <select id="sorteo_eq2" class="w-full bg-[#111] border border-white/10 p-3 text-xs text-white focus:border-baneAccent outline-none cursor-pointer"></select>
                </div>
                <div>
                    <label class="text-[9px] text-gray-500 uppercase tracking-widest mb-1 block">Estado del Match</label>
                    <select id="sorteo_status" class="w-full bg-[#111] border border-white/10 p-3 text-xs text-white focus:border-baneAccent outline-none cursor-pointer">
                        <option value="pending">Pendiente (VS)</option>
                        <option value="eq1">Avanza Equipo 1</option>
                        <option value="eq2">Avanza Equipo 2</option>
                    </select>
                </div>
            </div>
            
            <button onclick="agregarMatchSorteo()" class="w-full border border-white/20 bg-white/5 hover:bg-white/10 text-white font-bold text-xs uppercase tracking-[0.2em] p-4 mb-8 transition-colors">
                + Añadir Cruce a la Cartelera
            </button>

            <div class="bg-[#0a0a0a] border border-white/5 p-6 min-h-[150px] mb-6">
                <h3 class="text-[10px] text-baneAccent font-bold uppercase tracking-widest mb-4">Cartelera Actual (Borrador)</h3>
                <div id="lista-sorteo-admin" class="flex flex-col gap-2"></div>
            </div>

            <button onclick="publicarSorteo()" class="w-full bg-baneAccent text-black font-black text-sm uppercase tracking-[0.3em] p-5 hover:bg-white transition-colors shadow-lg">
                GUARDAR Y PUBLICAR BRACKET EN LA WEB
            </button>
        </div>

        <div id="tab-matches" class="tab-content bg-black border border-white/10 p-8 rounded-sm">
            <h2 class="font-heading text-2xl text-white font-bold uppercase tracking-widest mb-6 border-l-4 border-gray-500 pl-3">Subir Resultado BANE</h2>
            
            <form id="form-partidas" class="flex flex-col gap-4">
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="text-[9px] text-gray-500 uppercase tracking-widest mb-1 block">Nuestra Escuadra</label>
                        <select id="partida_escuadra" class="w-full bg-[#111] border border-white/10 p-3 text-xs text-white focus:border-baneAccent outline-none" required>
                            <option value="BANE VALORANT">BANE VALORANT</option>
                            <option value="BANE IGNITE">BANE IGNITE</option>
                            <option value="BANE BLAZE">BANE BLAZE</option>
                            <option value="MOBILE LEGENDS">MOBILE LEGENDS</option>
                        </select>
                    </div>
                    <div>
                        <label class="text-[9px] text-gray-500 uppercase tracking-widest mb-1 block">Torneo / Liga</label>
                        <input type="text" id="partida_torneo" placeholder="Ej: Premier S1" class="w-full bg-[#111] border border-white/10 p-3 text-xs text-white focus:border-baneAccent outline-none" required>
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-3 gap-4 items-end">
                    <div>
                        <label class="text-[9px] text-gray-500 uppercase tracking-widest mb-1 block">Score BANE</label>
                        <input type="number" id="partida_score_bane" placeholder="Ej: 13" class="w-full bg-[#111] border border-white/10 p-3 text-xs text-white focus:border-baneAccent outline-none text-center" required>
                    </div>
                    <div class="text-center font-heading text-2xl text-gray-600 font-bold mb-2">VS</div>
                    <div>
                        <label class="text-[9px] text-gray-500 uppercase tracking-widest mb-1 block">Score Rival</label>
                        <input type="number" id="partida_score_rival" placeholder="Ej: 9" class="w-full bg-[#111] border border-white/10 p-3 text-xs text-white focus:border-baneAccent outline-none text-center" required>
                    </div>
                </div>

                <div>
                    <label class="text-[9px] text-gray-500 uppercase tracking-widest mb-1 block">Nombre del Equipo Rival</label>
                    <input type="text" id="partida_rival" placeholder="Ej: KRÜ Esports" class="w-full bg-[#111] border border-white/10 p-3 text-xs text-white focus:border-baneAccent outline-none" required>
                </div>

                <button type="submit" class="mt-4 bg-white/10 hover:bg-white text-white hover:text-black font-bold text-xs uppercase tracking-[0.2em] p-4 transition-colors">
                    Publicar Resultado
                </button>
            </form>
        </div>

        <div id="tab-noticias" class="tab-content bg-black border border-white/10 p-8 rounded-sm">
            <h2 class="font-heading text-2xl text-white font-bold uppercase tracking-widest mb-6 border-l-4 border-gray-500 pl-3">Redactar Noticia</h2>
            
            <form id="form-noticias" class="flex flex-col gap-4">
                <div>
                    <label class="text-[9px] text-gray-500 uppercase tracking-widest mb-1 block">Titular</label>
                    <input type="text" id="noticia_titulo" placeholder="Ej: ¡Campeones Regionales!" class="w-full bg-[#111] border border-white/10 p-3 text-xs text-white focus:border-baneAccent outline-none" required>
                </div>
                <div>
                    <label class="text-[9px] text-gray-500 uppercase tracking-widest mb-1 block">Cuerpo de la noticia</label>
                    <textarea id="noticia_desc" rows="4" placeholder="Escribe los detalles aquí..." class="w-full bg-[#111] border border-white/10 p-3 text-xs text-white focus:border-baneAccent outline-none resize-none" required></textarea>
                </div>
                <div>
                    <label class="text-[9px] text-gray-500 uppercase tracking-widest mb-1 block">URL de Imagen (Opcional)</label>
                    <input type="text" id="noticia_img" placeholder="https://ejemplo.com/foto.png" class="w-full bg-[#111] border border-white/10 p-3 text-xs text-white focus:border-baneAccent outline-none">
                </div>

                <button type="submit" class="mt-4 bg-white/10 hover:bg-white text-white hover:text-black font-bold text-xs uppercase tracking-[0.2em] p-4 transition-colors">
                    Publicar Noticia
                </button>
            </form>
        </div>

    </div>

    <script>
        const API_URL = 'https://bane-esports-web-1.onrender.com/api';
        let bracketMatches = [];
        let bracketNoticiaId = null;

        document.addEventListener('DOMContentLoaded', () => {
            const token = localStorage.getItem('idToken');
            if (!token) { window.location.href = 'login.html'; return; }
            cargarDatosSorteo();
            
            // Listeners Formularios
            document.getElementById('form-partidas').addEventListener('submit', subirPartida);
            document.getElementById('form-noticias').addEventListener('submit', subirNoticia);
        });

        function getAuthHeaders() {
            return { 'Content-Type': 'application/json', 'Authorization': `Bearer ${localStorage.getItem('idToken')}` };
        }

        function cerrarSesion() {
            localStorage.removeItem('idToken');
            window.location.href = 'login.html';
        }

        // SISTEMA DE PESTAÑAS
        function switchTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            document.getElementById('btn-' + tabId).classList.add('active');
        }

        // --- LÓGICA DE PARTIDAS Y NOTICIAS ---
        async function subirPartida(e) {
            e.preventDefault();
            const btn = e.target.querySelector('button'); btn.innerText = "SUBIENDO...";
            const payload = {
                escuadra: document.getElementById('partida_escuadra').value,
                torneo: document.getElementById('partida_torneo').value,
                score_bane: parseInt(document.getElementById('partida_score_bane').value),
                score_rival: parseInt(document.getElementById('partida_score_rival').value),
                rival: document.getElementById('partida_rival').value
            };
            try {
                await fetch(`${API_URL}/partidas`, { method: 'POST', headers: getAuthHeaders(), body: JSON.stringify(payload) });
                alert("¡Resultado publicado!"); e.target.reset();
            } catch(err) { alert("Error"); }
            btn.innerText = "Publicar Resultado";
        }

        async function subirNoticia(e) {
            e.preventDefault();
            const btn = e.target.querySelector('button'); btn.innerText = "SUBIENDO...";
            const payload = {
                titulo: document.getElementById('noticia_titulo').value,
                descripcion: document.getElementById('noticia_desc').value,
                imagen_url: document.getElementById('noticia_img').value
            };
            try {
                await fetch(`${API_URL}/noticias`, { method: 'POST', headers: getAuthHeaders(), body: JSON.stringify(payload) });
                alert("¡Noticia publicada!"); e.target.reset();
            } catch(err) { alert("Error"); }
            btn.innerText = "Publicar Noticia";
        }

        // --- LÓGICA DEL BRACKET ---
        async function cargarDatosSorteo() {
            try {
                const resEq = await fetch(`${API_URL}/equipos`);
                const equipos = await resEq.json();
                
                const s1 = document.getElementById('sorteo_eq1');
                const s2 = document.getElementById('sorteo_eq2');
                let opts = '<option value="">-- Seleccionar Equipo --</option>';
                
                equipos.forEach(e => {
                    const nombreUpper = e.nombre.toUpperCase();
                    if(nombreUpper !== 'DATASY' && nombreUpper !== 'PEGASUS') {
                        opts += `<option value="${e.nombre}">${e.nombre}</option>`;
                    }
                });
                opts += `<option value="DATASY">DATASY (Invitado)</option>`;
                opts += `<option value="PEGASUS">PEGASUS (Invitado)</option>`;
                
                s1.innerHTML = opts;
                s2.innerHTML = opts + '<option value="BYE">-- PASE DIRECTO (BYE) --</option>';

                const resNot = await fetch(`${API_URL}/noticias`);
                const noticias = await resNot.json();
                const bracketData = noticias.find(n => n.titulo === '[BRACKET_DATA]');
                if (bracketData) {
                    bracketNoticiaId = bracketData.id;
                    bracketMatches = JSON.parse(bracketData.descripcion);
                } else { bracketMatches = []; }
                renderListaSorteo();
            } catch (e) { console.error("Error cargando Sorteo", e); }
        }

        function renderListaSorteo() {
            const lista = document.getElementById('lista-sorteo-admin');
            lista.innerHTML = '';
            if(bracketMatches.length === 0) {
                lista.innerHTML = '<p class="text-xs text-gray-600">No hay cruces configurados.</p>';
                return;
            }

            bracketMatches.forEach((m, idx) => {
                let statusText = m.status === 'pending' ? 'VS' : (m.status === 'eq1' ? `Ganó ${m.eq1}` : `Ganó ${m.eq2}`);
                lista.innerHTML += `
                    <div class="flex items-center justify-between border border-white/10 bg-black p-3 text-xs text-gray-300">
                        <div class="flex gap-4">
                            <span class="font-bold text-white w-48 truncate">${m.fase}</span>
                            <span>${m.eq1} <b class="text-baneAccent mx-2">${statusText}</b> ${m.eq2}</span>
                        </div>
                        <button onclick="borrarMatch(${idx})" class="text-gray-600 hover:text-baneAccent font-bold">X</button>
                    </div>
                `;
            });
        }

        function agregarMatchSorteo() {
            const fase = document.getElementById('sorteo_fase').value;
            const eq1 = document.getElementById('sorteo_eq1').value;
            const eq2 = document.getElementById('sorteo_eq2').value;
            const status = document.getElementById('sorteo_status').value;

            if(!fase || !eq1 || !eq2) { alert("Llena la Fase y los dos equipos."); return; }
            bracketMatches.push({ fase, eq1, eq2, status });
            renderListaSorteo();
        }

        function borrarMatch(idx) {
            bracketMatches.splice(idx, 1);
            renderListaSorteo();
        }

        async function publicarSorteo() {
            try {
                if (bracketNoticiaId) {
                    await fetch(`${API_URL}/noticias?id=${bracketNoticiaId}`, { method: 'DELETE', headers: getAuthHeaders() });
                }
                const payload = {
                    titulo: '[BRACKET_DATA]',
                    descripcion: JSON.stringify(bracketMatches),
                    imagen_url: 'HIDDEN'
                };
                const res = await fetch(`${API_URL}/noticias`, {
                    method: 'POST', headers: getAuthHeaders(), body: JSON.stringify(payload)
                });
                if(res.ok) {
                    alert('¡Sorteo y Resultados Publicados Exitosamente!');
                    cargarDatosSorteo();
                }
            } catch(e) { alert("Error publicando sorteo"); }
        }
    </script>
</body>
</html>
