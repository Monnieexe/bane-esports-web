<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bane Admin Panel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: { colors: { baneAccent: '#8b0000', baneAccentLight: '#ff4655' } }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Montserrat', sans-serif; background-color: #050505; color: white; }
        .font-heading { font-family: 'Cinzel', serif; }
    </style>
</head>
<body class="p-8">

    <div class="max-w-6xl mx-auto">
        <header class="flex justify-between items-center mb-12 border-b border-white/10 pb-6">
            <h1 class="font-heading text-3xl font-black tracking-widest">BANE <span class="text-baneAccentLight">ADMIN</span></h1>
            <div class="flex gap-6 items-center">
                <a href="index.html" class="text-xs tracking-[0.2em] uppercase text-gray-500 hover:text-white transition-colors">Volver a la Web</a>
                <button onclick="cerrarSesion()" class="text-xs tracking-[0.2em] uppercase text-red-500 hover:text-red-400 font-bold transition-colors">Cerrar Sesión</button>
            </div>
        </header>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-12">
            
            <!-- SECCIÓN 1: REGISTRAR PARTIDA -->
            <div class="bg-black border border-white/10 p-8 rounded-sm shadow-xl shadow-black">
                <h2 class="font-heading text-xl font-bold text-white uppercase tracking-widest mb-6 border-l-4 border-baneAccentLight pl-3">Registrar Partida</h2>
                
                <form id="form-partida" class="flex flex-col gap-4">
                    <div>
                        <label class="text-[10px] uppercase tracking-widest text-gray-400">Escuadra BANE</label>
                        <select id="escuadra" class="w-full bg-[#0a0a0a] border border-white/10 text-white p-3 text-sm focus:border-baneAccentLight outline-none mt-1 transition-colors" required>
                            <option value="BANE Legacy">BANE Legacy</option>
                            <option value="BANE Ignite">BANE Ignite</option>
                            <option value="BANE Blaze">BANE Blaze</option>
                            <option value="BANE Genesis">BANE Genesis</option>
                        </select>
                    </div>

                    <div>
                        <label class="text-[10px] uppercase tracking-widest text-gray-400">Equipo Rival</label>
                        <input type="text" id="rival" class="w-full bg-[#0a0a0a] border border-white/10 text-white p-3 text-sm focus:border-baneAccentLight outline-none mt-1 transition-colors" placeholder="Ej: Leviatán Academy" required>
                    </div>
                    <div>
                        <label class="text-[10px] uppercase tracking-widest text-gray-400">Torneo</label>
                        <input type="text" id="torneo" class="w-full bg-[#0a0a0a] border border-white/10 text-white p-3 text-sm focus:border-baneAccentLight outline-none mt-1 transition-colors" placeholder="Ej: Valorant Premier" required>
                    </div>
                    <div class="flex gap-4">
                        <div class="w-1/2">
                            <label class="text-[10px] uppercase tracking-widest text-baneAccentLight font-bold">Score BANE</label>
                            <input type="number" id="score_bane" class="w-full bg-[#0a0a0a] border border-white/10 text-white p-3 text-sm focus:border-baneAccentLight outline-none mt-1 transition-colors" required>
                        </div>
                        <div class="w-1/2">
                            <label class="text-[10px] uppercase tracking-widest text-gray-400">Score Rival</label>
                            <input type="number" id="score_rival" class="w-full bg-[#0a0a0a] border border-white/10 text-white p-3 text-sm focus:border-baneAccentLight outline-none mt-1 transition-colors" required>
                        </div>
                    </div>
                    <button type="submit" class="mt-4 border border-baneAccentLight bg-baneAccentLight/10 text-baneAccentLight hover:bg-baneAccentLight hover:text-black font-bold uppercase tracking-widest text-xs py-4 transition-all">
                        Guardar Resultado
                    </button>
                </form>
            </div>

            <!-- SECCIÓN 2: PUBLICAR VLOG / NOTICIA -->
            <div class="bg-black border border-white/10 p-8 rounded-sm shadow-xl shadow-black">
                <h2 class="font-heading text-xl font-bold text-white uppercase tracking-widest mb-6 border-l-4 border-baneAccentLight pl-3">Publicar Vlog / Noticia</h2>
                
                <form id="form-noticia" class="flex flex-col gap-4">
                    <div>
                        <label class="text-[10px] uppercase tracking-widest text-gray-400">Título</label>
                        <input type="text" id="titulo_noticia" class="w-full bg-[#0a0a0a] border border-white/10 text-white p-3 text-sm focus:border-baneAccentLight outline-none mt-1 transition-colors" placeholder="Ej: Bootcamping en Monterrey" required>
                    </div>
                    <div>
                        <label class="text-[10px] uppercase tracking-widest text-gray-400">ID del Video de YouTube (Opcional)</label>
                        <input type="text" id="youtube_id" class="w-full bg-[#0a0a0a] border border-white/10 text-white p-3 text-sm focus:border-baneAccentLight outline-none mt-1 transition-colors" placeholder="Ej: dQw4w9WgXcQ">
                    </div>
                    <div>
                        <label class="text-[10px] uppercase tracking-widest text-gray-400">URL de la Imagen (Opcional)</label>
                        <input type="text" id="imagen_url" class="w-full bg-[#0a0a0a] border border-white/10 text-white p-3 text-sm focus:border-baneAccentLight outline-none mt-1 transition-colors" placeholder="Ej: https://i.imgur.com/foto.jpg">
                    </div>
                    <div>
                        <label class="text-[10px] uppercase tracking-widest text-gray-400">Descripción breve</label>
                        <textarea id="desc_noticia" rows="3" class="w-full bg-[#0a0a0a] border border-white/10 text-white p-3 text-sm focus:border-baneAccentLight outline-none mt-1 transition-colors" required></textarea>
                    </div>
                    <button type="submit" class="mt-4 border border-baneAccentLight bg-baneAccentLight/10 text-baneAccentLight hover:bg-baneAccentLight hover:text-black font-bold uppercase tracking-widest text-xs py-4 transition-all">
                        Publicar Contenido
                    </button>
                </form>
            </div>

        </div>
    </div>

    <script>
        const API_URL = 'https://bane-esports-web-1.onrender.com/api';

        // Función de seguridad
        function getAuthHeaders() {
            const token = localStorage.getItem('idToken');
            return {
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${token}` 
            };
        }

        function cerrarSesion() {
            localStorage.removeItem('idToken');
            window.location.href = 'index.html';
        }

        // POST: Lógica de Partidas
        document.getElementById('form-partida').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btnSubmit = e.target.querySelector('button[type="submit"]');
            const textoOriginal = btnSubmit.innerText;
            btnSubmit.innerText = 'GUARDANDO...';
            btnSubmit.disabled = true;

            const nuevaPartida = {
                escuadra: document.getElementById('escuadra').value,
                rival: document.getElementById('rival').value,
                torneo: document.getElementById('torneo').value,
                score_bane: parseInt(document.getElementById('score_bane').value),
                score_rival: parseInt(document.getElementById('score_rival').value)
            };
            
            try {
                const response = await fetch(`${API_URL}/partidas`, {
                    method: 'POST',
                    headers: getAuthHeaders(),
                    body: JSON.stringify(nuevaPartida)
                });

                if (response.ok) {
                    alert("¡Resultado de BANE guardado con éxito en la nube!");
                    e.target.reset(); 
                } else {
                    const data = await response.json();
                    alert("No tienes permisos: " + (data.error || "Sesión expirada"));
                }
            } catch (error) {
                console.error("Error:", error);
                alert("Error de conexión con el servidor en la nube.");
            } finally {
                btnSubmit.innerText = textoOriginal;
                btnSubmit.disabled = false;
            }
        });

        // POST: Lógica de Noticias
        document.getElementById('form-noticia').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btnSubmit = e.target.querySelector('button[type="submit"]');
            const textoOriginal = btnSubmit.innerText;
            btnSubmit.innerText = 'PUBLICANDO...';
            btnSubmit.disabled = true;

            const nuevaNoticia = {
                titulo: document.getElementById('titulo_noticia').value,
                youtube_id: document.getElementById('youtube_id').value,
                imagen_url: document.getElementById('imagen_url').value,
                descripcion: document.getElementById('desc_noticia').value
            };
            
            try {
                const response = await fetch(`${API_URL}/noticias`, {
                    method: 'POST',
                    headers: getAuthHeaders(),
                    body: JSON.stringify(nuevaNoticia)
                });

                if (response.ok) {
                    alert("¡Contenido publicado con éxito en la web!");
                    e.target.reset();
                } else {
                    const data = await response.json();
                    alert("No tienes permisos: " + (data.error || "Sesión expirada"));
                }
            } catch (error) {
                console.error("Error:", error);
                alert("Error de conexión con el servidor en la nube.");
            } finally {
                btnSubmit.innerText = textoOriginal;
                btnSubmit.disabled = false;
            }
        });
    </script>
</body>
</html>
