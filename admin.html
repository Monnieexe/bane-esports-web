<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>5ever | Control Nexus</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { theme: { extend: { colors: { vctRed: '#ff4655', everGold: '#D4AF37', everDark: '#0f1923' } } } }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Tungsten:wght@600&family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Montserrat', sans-serif; background-color: #000; color: #ece8e1; }
        .font-vct { font-weight: 900; }
        .tab-content { display: none; } .tab-content.active { display: block; }
        .tab-btn { border-bottom: 2px solid transparent; } .tab-btn.active { border-bottom-color: #ff4655; color: white; }
        .clip-btn { clip-path: polygon(0 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%); }
        .input-admin { background: #111; border: 1px solid rgba(255,255,255,0.1); transition: all 0.2s; }
        .input-admin:focus { border-color: #ff4655; outline: none; background: #000; }
        .custom-scrollbar::-webkit-scrollbar { width: 4px; height: 4px; } .custom-scrollbar::-webkit-scrollbar-thumb { background: #ff4655; }
    </style>
</head>
<body class="antialiased p-4 md:p-8 min-h-screen">

    <div class="max-w-6xl mx-auto">
        
        <div class="flex justify-between items-center mb-8 border-b border-white/10 pb-6 bg-[#0a0a0a] p-6 clip-btn border border-white/5">
            <div>
                <h1 class="font-vct text-3xl md:text-4xl text-white uppercase tracking-tighter"><span class="text-vctRed">5</span>EVER <span class="text-gray-600">ADMIN</span></h1>
                <p class="text-[9px] text-green-500 uppercase tracking-widest font-bold mt-1">Conexión Segura Establecida</p>
            </div>
            <button onclick="cerrarSesion()" class="clip-btn border border-gray-800 text-[9px] font-bold text-gray-400 hover:text-white hover:bg-vctRed uppercase tracking-widest transition-all px-6 py-3 bg-black">CERRAR SESIÓN</button>
        </div>

        <div class="flex gap-8 mb-8 border-b border-white/5 pb-0 overflow-x-auto custom-scrollbar">
            <button onclick="switchTab('tab-bracket')" id="btn-tab-bracket" class="tab-btn active text-[10px] font-black uppercase tracking-[0.2em] pb-3 text-gray-500 transition-colors whitespace-nowrap">Configurar Arena</button>
            <button onclick="switchTab('tab-equipos')" id="btn-tab-equipos" class="tab-btn text-[10px] font-black uppercase tracking-[0.2em] pb-3 text-gray-500 transition-colors whitespace-nowrap">Registros Roster</button>
        </div>

        <!-- PESTAÑA: SORTEO -->
        <div id="tab-bracket" class="tab-content active bg-[#0a0a0a] border border-white/5 p-6 md:p-10 clip-btn">
            <h2 class="font-vct text-2xl text-white uppercase tracking-tight mb-8">NUEVO ENFRENTAMIENTO</h2>
            
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-6">
                <div>
                    <label class="text-[9px] text-gray-400 uppercase tracking-widest mb-2 block font-bold">Fase</label>
                    <input type="text" id="sorteo_fase" placeholder="Ej: Octavos" class="input-admin clip-btn w-full p-3 text-xs text-white">
                </div>
                <div>
                    <label class="text-[9px] text-gray-400 uppercase tracking-widest mb-2 block font-bold">Estado</label>
                    <select id="sorteo_status" class="input-admin clip-btn w-full p-3 text-xs text-white cursor-pointer font-bold">
                        <option value="pending">En Progreso (VS)</option><option value="eq1">Gana Eq 1</option><option value="eq2">Gana Eq 2</option>
                    </select>
                </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-12 gap-6 mb-8 items-end bg-black p-6 border border-white/5 clip-btn">
                <div class="md:col-span-4">
                    <label class="text-[9px] text-gray-500 uppercase tracking-widest mb-2 block font-bold">Eq 1</label>
                    <select id="sorteo_eq1" class="input-admin w-full p-3 text-xs text-white font-bold"></select>
                </div>
                <div class="md:col-span-2">
                    <label class="text-[9px] text-gray-500 uppercase tracking-widest mb-2 block font-bold text-center">Score 1</label>
                    <input type="number" id="sorteo_score1" placeholder="0" class="input-admin w-full p-3 text-xs text-center font-bold text-everGold">
                </div>
                <div class="md:col-span-2">
                    <label class="text-[9px] text-gray-500 uppercase tracking-widest mb-2 block font-bold text-center">Score 2</label>
                    <input type="number" id="sorteo_score2" placeholder="0" class="input-admin w-full p-3 text-xs text-center font-bold text-everGold">
                </div>
                <div class="md:col-span-4">
                    <label class="text-[9px] text-gray-500 uppercase tracking-widest mb-2 block font-bold">Eq 2</label>
                    <select id="sorteo_eq2" class="input-admin w-full p-3 text-xs text-white font-bold"></select>
                </div>
            </div>
            
            <button onclick="agregarMatchSorteo()" class="w-full clip-btn border border-white/20 text-white font-black text-xs uppercase tracking-[0.2em] p-4 mb-10 hover:bg-white hover:text-black transition-all">
                AGREGAR A CARTELERA
            </button>

            <div class="bg-black border border-white/5 p-6 mb-8">
                <h3 class="text-[9px] text-vctRed font-bold uppercase tracking-widest mb-4">Cartelera Local (Pendiente de Publicar)</h3>
                <div id="lista-sorteo-admin" class="flex flex-col gap-2"></div>
            </div>

            <button onclick="publicarSorteo()" class="w-full clip-btn bg-vctRed text-white font-black text-sm md:text-base uppercase tracking-[0.3em] p-5 hover:bg-white hover:text-vctRed transition-all shadow-[0_0_20px_rgba(255,70,85,0.3)]">
                PUBLICAR BRACKET EN VIVO
            </button>
        </div>

        <!-- PESTAÑA: EQUIPOS INSCRITOS -->
        <div id="tab-equipos" class="tab-content bg-[#0a0a0a] border border-white/5 p-6 md:p-10 clip-btn">
            <div class="flex justify-between items-center mb-8">
                <h2 class="font-vct text-2xl text-white uppercase tracking-tight">BASE DE DATOS</h2>
                <span id="contador-equipos" class="bg-white/10 text-white text-[9px] font-bold px-3 py-1 uppercase tracking-widest">0 EQUIPOS</span>
            </div>
            
            <div class="flex flex-col gap-4" id="lista-equipos-admin">
                <!-- Se inyecta desde JS -->
            </div>
        </div>

    </div>

    <script>
        const API_URL = 'https://bane-esports-web-1.onrender.com/api';
        let bracketMatches = []; let bracketNoticiaId = null;

        document.addEventListener('DOMContentLoaded', () => {
            if (!localStorage.getItem('idToken')) { window.location.href = 'login.html'; return; }
            cargarEquiposInscritos(); cargarDatosSorteo();
        });

        function getAuthHeaders() { return { 'Content-Type': 'application/json', 'Authorization': `Bearer ${localStorage.getItem('idToken')}` }; }
        function cerrarSesion() { localStorage.removeItem('idToken'); window.location.href = 'login.html'; }
        function switchTab(t) { document.querySelectorAll('.tab-content, .tab-btn').forEach(e => e.classList.remove('active')); document.getElementById(t).classList.add('active'); document.getElementById('btn-'+t).classList.add('active'); }

        async function cargarEquiposInscritos() {
            try {
                const res = await fetch(`${API_URL}/equipos`);
                const equipos = await res.json();
                document.getElementById('contador-equipos').innerText = `${equipos.length} EQUIPOS`;
                const lista = document.getElementById('lista-equipos-admin'); lista.innerHTML = '';
                
                equipos.forEach((eq, idx) => {
                    const imgHtml = eq.logo_url ? `<img src="${eq.logo_url}" class="w-8 h-8 object-contain">` : `<div class="text-white font-bold">${eq.nombre.charAt(0)}</div>`;
                    
                    let rosterHtml = '';
                    if(eq.jugadores && eq.jugadores.length > 0) {
                        rosterHtml = `<div id="admin-roster-${idx}" class="hidden mt-4 pt-4 border-t border-white/5 grid grid-cols-2 gap-2">`;
                        eq.jugadores.forEach(j => {
                            rosterHtml += `<div class="bg-[#111] p-2 px-3 border-l border-vctRed text-[10px] font-bold text-white uppercase tracking-widest">${j.riot_id}</div>`;
                        });
                        rosterHtml += `</div>`;
                    }

                    lista.innerHTML += `
                        <div class="bg-black border border-white/5 p-4 clip-btn hover:border-white/20 transition-colors">
                            <div class="flex items-center justify-between">
                                <div class="flex items-center gap-4 cursor-pointer" onclick="document.getElementById('admin-roster-${idx}').classList.toggle('hidden')">
                                    ${imgHtml}
                                    <span class="font-vct text-sm text-white uppercase tracking-wider">${eq.nombre}</span>
                                    <span class="text-[9px] text-gray-500 uppercase tracking-widest ml-4 hidden sm:block">DC: ${eq.discord_capitan || 'N/A'}</span>
                                    <span class="text-[8px] border border-white/10 px-2 py-1 text-gray-400 hover:text-white ml-2">ROSTER ▼</span>
                                </div>
                                <button onclick="borrarEquipoInscrito('${eq.id}')" class="text-gray-600 hover:text-vctRed text-xs font-bold px-4">✕ PURGAR</button>
                            </div>
                            ${rosterHtml}
                        </div>`;
                });
            } catch (e) { console.error(e); }
        }

        async function borrarEquipoInscrito(id) {
            if(confirm("⚠ ¿Borrar equipo?")) {
                await fetch(`${API_URL}/equipos?id=${id}`, { method: 'DELETE', headers: getAuthHeaders() });
                cargarEquiposInscritos(); cargarDatosSorteo();
            }
        }

        async function cargarDatosSorteo() {
            try {
                const res = await fetch(`${API_URL}/equipos`);
                const equipos = await res.json();
                let opts = '<option value="">-- SELECCIONAR --</option>';
                equipos.forEach(e => { opts += `<option value="${e.nombre}">${e.nombre}</option>`; });
                document.getElementById('sorteo_eq1').innerHTML = opts; 
                document.getElementById('sorteo_eq2').innerHTML = opts + '<option value="BYE">BYE</option>';

                const resNot = await fetch(`${API_URL}/noticias`);
                const noticias = await resNot.json();
                const bd = noticias.find(n => n.titulo === '[BRACKET_DATA]');
                bracketMatches = bd ? JSON.parse(bd.descripcion) : [];
                renderListaSorteo();
            } catch (e) {}
        }

        function renderListaSorteo() {
            const lista = document.getElementById('lista-sorteo-admin'); lista.innerHTML = '';
            bracketMatches.forEach((m, i) => {
                let st = m.status === 'pending' ? 'VS' : 'WIN';
                lista.innerHTML += `
                    <div class="flex items-center justify-between border-b border-white/5 py-3 text-[9px] uppercase tracking-widest text-gray-400">
                        <div class="flex gap-4">
                            <span class="text-white w-24 truncate font-bold">${m.fase}</span>
                            <span>${m.eq1} <b class="text-vctRed mx-1">x</b> ${m.eq2}</span>
                            <span class="text-everGold ml-4">${st} [${m.score1 || '-'}:${m.score2 || '-'}]</span>
                        </div>
                        <button onclick="borrarMatch(${i})" class="text-gray-600 hover:text-vctRed font-bold text-xs">✕</button>
                    </div>`;
            });
        }

        function agregarMatchSorteo() {
            const m = {
                fase: document.getElementById('sorteo_fase').value,
                eq1: document.getElementById('sorteo_eq1').value,
                eq2: document.getElementById('sorteo_eq2').value,
                score1: document.getElementById('sorteo_score1').value,
                score2: document.getElementById('sorteo_score2').value,
                status: document.getElementById('sorteo_status').value
            };
            if(!m.fase || !m.eq1 || !m.eq2) return alert("Faltan datos.");
            bracketMatches.push(m);
            document.getElementById('sorteo_score1').value = ''; document.getElementById('sorteo_score2').value = '';
            renderListaSorteo();
        }
        function borrarMatch(i) { bracketMatches.splice(i, 1); renderListaSorteo(); }

        async function publicarSorteo() {
            const b = document.querySelector('button[onclick="publicarSorteo()"]'); const t = b.innerText; b.innerText = "Sincronizando...";
            try {
                if(bracketNoticiaId) await fetch(`${API_URL}/noticias?id=${bracketNoticiaId}`, { method: 'DELETE', headers: getAuthHeaders() });
                const res = await fetch(`${API_URL}/noticias`, { method: 'POST', headers: getAuthHeaders(), body: JSON.stringify({ titulo: '[BRACKET_DATA]', descripcion: JSON.stringify(bracketMatches), imagen_url: 'HIDDEN' }) });
                if(res.ok) { alert('✅ Publicado.'); cargarDatosSorteo(); }
                else if(res.status === 401) alert("Sesión expirada.");
            } catch(e) {} finally { b.innerText = t; }
        }
    </script>
</body>
</html>
