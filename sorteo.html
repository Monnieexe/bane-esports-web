<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>5ever | The Arena</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { theme: { extend: { colors: { vctRed: '#ff2a3f', everGold: '#e5c05c', bgDark: '#050507' } } } }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Montserrat', sans-serif; background-color: #050507; color: white; overflow-x: hidden; }
        
        /* Efecto de Fondo Dinámico */
        .bg-rays { position: fixed; inset: 0; z-index: -1; background: radial-gradient(circle at 50% 0%, rgba(255, 42, 63, 0.1) 0%, transparent 50%); }
        .bg-rays::after { content: ''; position: absolute; inset: 0; background: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="4" height="4"><rect width="1" height="1" fill="rgba(255,255,255,0.05)"/></svg>'); opacity: 0.5; }

        .clip-card { clip-path: polygon(15px 0, 100% 0, 100% calc(100% - 15px), calc(100% - 15px) 100%, 0 100%, 0 15px); }
        .clip-nav { clip-path: polygon(0 0, 100% 0, calc(100% - 20px) 100%, 0 100%); }
        
        /* Animaciones Staggered (Cascada) */
        .animate-item { opacity: 0; transform: translateY(30px); animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        @keyframes slideUp { to { opacity: 1; transform: translateY(0); } }
        
        /* Efecto Láser Hover en Cartas */
        .match-card { position: relative; overflow: hidden; transition: all 0.4s; }
        .match-card::before {
            content: ''; position: absolute; top: 0; left: -100%; width: 50%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,42,63,0.2), transparent);
            transform: skewX(-20deg); transition: 0.5s; z-index: 1; pointer-events: none;
        }
        .match-card:hover::before { left: 200%; }
        .match-card:hover { border-color: #ff2a3f; transform: scale(1.02); box-shadow: 0 10px 30px -10px rgba(255,42,63,0.3); }

        /* Smooth Accordion */
        .roster-panel { display: grid; grid-template-rows: 0fr; transition: grid-template-rows 0.3s ease-out; }
        .roster-panel.open { grid-template-rows: 1fr; }
        .roster-content { overflow: hidden; }

        .custom-scrollbar::-webkit-scrollbar { width: 3px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #ff2a3f; }
    </style>
</head>
<body class="selection:bg-vctRed selection:text-white antialiased min-h-screen">

    <div class="bg-rays"></div>

    <!-- NAVBAR DINÁMICO -->
    <nav class="w-full bg-black/80 backdrop-blur-xl border-b border-white/5 sticky top-0 z-50 flex items-center justify-between">
        <div class="bg-[#111] px-8 py-5 clip-nav flex items-center gap-3 border-b-2 border-vctRed">
            <span class="text-3xl font-black tracking-tighter text-white drop-shadow-[0_0_10px_rgba(255,255,255,0.2)]"><span class="text-vctRed">5</span>EVER</span>
            <span class="text-[8px] text-gray-500 uppercase tracking-[0.4em] font-bold border-l border-white/20 pl-3">Live Feed</span>
        </div>
        <div class="pr-6">
            <a href="registro-torneo.html" class="relative group inline-block font-black text-[10px] uppercase tracking-[0.2em] text-white overflow-hidden bg-[#111] px-8 py-3 border border-white/10 hover:border-vctRed transition-colors">
                <span class="relative z-10">Ingresar Equipo</span>
                <div class="absolute inset-0 bg-vctRed transform scale-x-0 group-hover:scale-x-100 transition-transform origin-left duration-300"></div>
            </a>
        </div>
    </nav>

    <div class="max-w-7xl mx-auto px-4 sm:px-6 py-12 relative z-10">
        
        <div class="text-center mb-24 animate-item" style="animation-delay: 0.1s;">
            <h1 class="text-6xl md:text-8xl font-black uppercase tracking-tighter mb-2 leading-none">THE <span class="text-transparent bg-clip-text bg-gradient-to-br from-everGold to-yellow-700">ARENA</span></h1>
            <p class="text-vctRed text-[10px] tracking-[0.6em] uppercase font-bold bg-vctRed/10 inline-block px-4 py-1 border border-vctRed/30">Esports Championship</p>
        </div>

        <!-- LEADERBOARD DINÁMICO -->
        <div class="mb-32 animate-item" style="animation-delay: 0.2s;">
            <h3 class="text-2xl font-black text-white uppercase tracking-tight mb-8 flex items-center gap-3"><span class="w-3 h-3 bg-everGold inline-block animate-pulse"></span> STANDINGS ELITE</h3>
            
            <div class="bg-black/40 backdrop-blur-sm border border-white/5 p-4 clip-card">
                <div class="flex justify-between text-[9px] uppercase tracking-[0.3em] text-gray-500 font-bold pb-3 mb-2 px-4">
                    <span>División</span><span>Rendimiento</span>
                </div>
                <div id="tabla-posiciones" class="flex flex-col gap-2"></div>
            </div>
        </div>

        <!-- BRACKET EN CASCADA -->
        <div id="contenedor-sorteo" class="flex flex-col gap-16"></div>

    </div>

    <script>
        const API_URL = 'https://bane-esports-web-1.onrender.com/api';
        let dataEq = []; let wins = {}; 

        document.addEventListener('DOMContentLoaded', initApp);

        async function initApp() {
            try {
                const [resEq, resNot] = await Promise.all([fetch(`${API_URL}/equipos`), fetch(`${API_URL}/noticias`)]);
                if(resEq.ok) { dataEq = await resEq.json(); dataEq.forEach(e => wins[e.nombre] = 0); }
                const bData = (await resNot.json()).find(n => n.titulo === '[BRACKET_DATA]');
                
                if (bData && bData.descripcion !== '[]') {
                    const matches = JSON.parse(bData.descripcion);
                    matches.forEach(m => {
                        if(m.eq1 && !wins[m.eq1]) wins[m.eq1] = 0; if(m.eq2 && m.eq2!=='BYE' && !wins[m.eq2]) wins[m.eq2] = 0;
                        if(m.status === 'eq1') wins[m.eq1]++; if(m.status === 'eq2' && m.eq2!=='BYE') wins[m.eq2]++;
                    });
                    renderLeaderboard(); renderMatches(matches);
                } else {
                    renderLeaderboard();
                    document.getElementById('contenedor-sorteo').innerHTML = `<div class="text-center p-12 bg-black/40 border border-white/5 animate-item"><p class="text-gray-500 font-bold uppercase tracking-widest text-[10px]">Esperando despliegue de llaves...</p></div>`;
                }
            } catch (e) {}
        }

        function toggleRoster(id) { document.getElementById(id).classList.toggle('open'); }

        function renderLeaderboard() {
            const t = document.getElementById('tabla-posiciones'); t.innerHTML = '';
            const sorted = dataEq.map(e => ({...e, w: wins[e.nombre]||0})).sort((a,b) => b.w - a.w);
            if(sorted.length === 0) { t.innerHTML = '<p class="text-[10px] text-gray-600 text-center py-6">Sin datos.</p>'; return; }

            sorted.forEach((item, idx) => {
                let img = item.logo_url ? `<img src="${item.logo_url}" class="w-10 h-10 object-contain drop-shadow-md">` : `<div class="w-10 h-10 bg-[#111] flex items-center justify-center font-bold text-white">${item.nombre.charAt(0)}</div>`;
                let rank = `<span class="text-gray-600 text-sm font-black w-6">${idx + 1}</span>`;
                if(idx===0) rank = `<span class="text-everGold text-xl font-black w-6">1</span>`;

                let rHtml = '';
                if(item.jugadores && item.jugadores.length > 0) {
                    rHtml = `<div class="roster-panel" id="rost-${idx}"><div class="roster-content pt-4 mt-2 border-t border-white/5 grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-2">`;
                    item.jugadores.forEach(j => {
                        rHtml += `<a href="${j.tracker_url}" target="_blank" class="flex justify-between items-center bg-[#0a0a0c] p-3 border border-white/5 hover:border-vctRed transition-colors group">
                            <span class="text-[10px] text-white font-bold uppercase tracking-wider">${j.riot_id}</span>
                            <span class="text-[8px] text-gray-600 group-hover:text-vctRed font-bold uppercase">Tracker ↗</span>
                        </a>`;
                    });
                    rHtml += `</div></div>`;
                } else { rHtml = `<div class="roster-panel" id="rost-${idx}"><div class="roster-content pt-4 mt-2 text-[9px] text-gray-500 uppercase">Sin Roster.</div></div>`; }

                t.innerHTML += `
                    <div class="bg-[#050505] hover:bg-[#0a0a0c] border border-white/5 p-4 transition-all duration-300 animate-item" style="animation-delay: ${idx * 0.1}s;">
                        <div class="flex items-center justify-between cursor-pointer" onclick="toggleRoster('rost-${idx}')">
                            <div class="flex items-center gap-4">${rank} ${img} <span class="font-bold text-sm md:text-base text-white uppercase tracking-wider">${item.nombre}</span></div>
                            <div class="flex items-center gap-6">
                                <span class="text-sm font-black text-white">${item.w} <span class="text-vctRed">W</span></span>
                                <span class="text-[9px] text-vctRed uppercase font-bold border border-vctRed/30 px-3 py-1 hover:bg-vctRed hover:text-white transition-colors hidden sm:block">ROSTER</span>
                            </div>
                        </div>
                        ${rHtml}
                    </div>`;
            });
        }

        function getImg(name) {
            const eq = dataEq.find(e => e.nombre === name);
            if(eq && eq.logo_url) return `<img src="${eq.logo_url}" class="w-16 h-16 md:w-20 md:h-20 object-contain z-10 relative">`;
            return `<div class="w-16 h-16 md:w-20 md:h-20 bg-[#111] border border-white/5 flex items-center justify-center font-bold text-2xl text-gray-700 z-10 relative">${name.charAt(0)}</div>`;
        }

        function renderMatches(matches) {
            const c = document.getElementById('contenedor-sorteo'); c.innerHTML = '';
            const fases = {}; matches.forEach(m => { if(!fases[m.fase]) fases[m.fase] = []; fases[m.fase].push(m); });

            let delay = 0.3;
            for (const f in fases) {
                let html = `<div class="mb-12"><h3 class="text-xl md:text-2xl font-black text-white uppercase tracking-widest mb-8 flex items-center gap-4 animate-item" style="animation-delay: ${delay}s;"><div class="h-px bg-vctRed w-8"></div> ${f}</h3><div class="grid grid-cols-1 xl:grid-cols-2 gap-6">`;
                
                fases[f].forEach(m => {
                    delay += 0.1;
                    let c1 = 'text-white', c2 = 'text-white', o1 = '', o2 = '';
                    let mid = '<span class="text-gray-600 font-black text-2xl md:text-3xl italic opacity-50">VS</span>';
                    
                    if (m.score1 && m.score2) mid = `<div class="flex flex-col items-center z-10"><span class="text-everGold font-black text-3xl md:text-5xl drop-shadow-[0_0_15px_rgba(229,192,92,0.4)]">${m.score1} <span class="text-white/30 text-2xl">-</span> ${m.score2}</span></div>`;
                    else if (m.status !== 'pending' && m.eq2 !== 'BYE') mid = '<span class="text-vctRed font-bold text-[9px] uppercase tracking-widest text-center border border-vctRed px-2 py-1 bg-vctRed/10 z-10">CERRADO</span>';

                    if (m.status === 'eq1') { c1 = 'text-everGold'; c2 = 'text-gray-600 line-through'; o2 = 'opacity-30 grayscale'; } 
                    else if (m.status === 'eq2') { c2 = 'text-everGold'; c1 = 'text-gray-600 line-through'; o1 = 'opacity-30 grayscale'; }

                    if (m.eq2 === 'BYE') { mid = '<span class="text-gray-600 font-bold text-[8px] uppercase tracking-widest text-center z-10">BYE</span>'; c2 = 'text-gray-800'; o2 = 'opacity-10'; m.eq2 = 'VACANTE'; }

                    html += `
                        <div class="match-card clip-card bg-[#0a0a0c] border border-white/5 p-6 flex items-center justify-between animate-item" style="animation-delay: ${delay}s;">
                            <div class="flex items-center gap-4 flex-1 ${o1}">${getImg(m.eq1)}<h4 class="text-sm md:text-xl ${c1} font-black uppercase tracking-wider truncate z-10">${m.eq1}</h4></div>
                            <div class="px-2 md:px-6 flex flex-col items-center">${mid}</div>
                            <div class="flex items-center gap-4 flex-1 justify-end text-right ${o2}"><h4 class="text-sm md:text-xl ${c2} font-black uppercase tracking-wider truncate z-10">${m.eq2}</h4>${m.eq2==='VACANTE' ? '<div class="w-16 h-16"></div>' : getImg(m.eq2)}</div>
                        </div>`;
                });
                html += `</div></div>`; c.innerHTML += html;
            }
        }
    </script>
</body>
</html>
