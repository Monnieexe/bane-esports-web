<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sorteo Oficial | Bane Invitational</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { theme: { extend: { colors: { baneAccent: '#8b0000', baneAccentLight: '#ff4655' } } } }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=Montserrat:wght@300;400;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Montserrat', sans-serif; background-color: #000; color: white; overflow-x: hidden; }
        .font-heading { font-family: 'Cinzel', serif; }
    </style>
</head>
<body class="selection:bg-baneAccentLight selection:text-black antialiased">

    <nav class="w-full bg-[#050505] border-b border-white/5 py-4 px-6 md:px-12 flex items-center justify-between z-50 relative">
        <div class="font-heading text-2xl font-black tracking-widest text-white">
            <span class="text-baneAccentLight">B</span> BANE <span class="text-gray-600 text-sm ml-2 hidden sm:inline">| MATCHMAKING</span>
        </div>
        <a href="index.html" class="text-gray-400 hover:text-white text-[10px] font-bold uppercase tracking-[0.2em] transition-all">Volver al Inicio</a>
    </nav>

    <div class="max-w-7xl mx-auto px-6 py-20 relative z-10">
        <div class="text-center mb-16">
            <h1 class="font-heading text-4xl md:text-6xl font-black text-white uppercase tracking-widest mb-4">La Arena</h1>
            <p class="font-primary text-gray-400 text-sm tracking-widest uppercase">Seguimiento Oficial del Torneo</p>
        </div>

        <div id="contenedor-sorteo" class="flex flex-col gap-16">
            <div class="text-center p-12 border border-white/5 bg-[#050505] rounded-sm">
                <p class="font-primary text-gray-500 text-sm uppercase tracking-widest animate-pulse">Desencriptando llaves del servidor...</p>
            </div>
        </div>

    </div>

    <script>
        const API_URL = 'https://bane-esports-web-1.onrender.com/api';
        let diccionarioLogos = {};

        document.addEventListener('DOMContentLoaded', cargarSorteoYLogos);

        async function cargarSorteoYLogos() {
            const contenedor = document.getElementById('contenedor-sorteo');
            try {
                // 1. Cargar equipos para extraer sus logos
                const resEq = await fetch(`${API_URL}/equipos`);
                if(resEq.ok) {
                    const equipos = await resEq.json();
                    equipos.forEach(e => {
                        if (e.logo_url) diccionarioLogos[e.nombre] = e.logo_url;
                    });
                }

                // 2. Cargar el Bracket
                const resNot = await fetch(`${API_URL}/noticias`);
                const noticias = await resNot.json();
                
                const bracketData = noticias.find(n => n.titulo === '[BRACKET_DATA]');
                
                if (bracketData && bracketData.descripcion !== '[]') {
                    const matches = JSON.parse(bracketData.descripcion);
                    renderizarCartelera(matches, contenedor);
                } else {
                    contenedor.innerHTML = `
                        <div class="text-center p-12 border border-[#ff4655]/20 bg-[#050505] rounded-sm shadow-[0_0_20px_rgba(255,70,85,0.1)]">
                            <p class="font-primary text-[#ff4655] text-sm uppercase tracking-widest font-bold">El Staff aún está configurando los enfrentamientos.</p>
                        </div>`;
                }
            } catch (e) {
                contenedor.innerHTML = `<div class="text-center p-12 bg-[#050505]"><p class="text-gray-500 uppercase">Error de conexión.</p></div>`;
            }
        }

        function getLogoHtml(nombreEquipo) {
            if(diccionarioLogos[nombreEquipo]) {
                return `<img src="${diccionarioLogos[nombreEquipo]}" class="w-12 h-12 md:w-16 md:h-16 object-contain bg-black border border-white/10 p-1 rounded-sm shadow-md">`;
            }
            return `<div class="w-12 h-12 md:w-16 md:h-16 bg-black border border-white/10 rounded-sm flex items-center justify-center font-heading text-xl md:text-3xl text-gray-500 shadow-md">${nombreEquipo.charAt(0)}</div>`;
        }

        function renderizarCartelera(matches, contenedor) {
            contenedor.innerHTML = '';
            
            const fases = {};
            matches.forEach(m => {
                if(!fases[m.fase]) fases[m.fase] = [];
                fases[m.fase].push(m);
            });

            for (const fase in fases) {
                let html = `
                    <div class="mb-4">
                        <h3 class="font-heading text-2xl font-bold text-white uppercase tracking-widest mb-8 border-l-4 border-baneAccentLight pl-4">${fase}</h3>
                        <div class="grid grid-cols-1 xl:grid-cols-2 gap-6">
                `;

                fases[fase].forEach(m => {
                    let col1 = 'text-white', col2 = 'text-white';
                    let op1 = 'opacity-100', op2 = 'opacity-100';
                    let badge1 = '', badge2 = '';
                    let centro = '<span class="text-baneAccentLight font-black text-2xl md:text-4xl drop-shadow-[0_0_10px_rgba(255,70,85,0.3)]">VS</span>';
                    let cardBorder = 'border-white/5 hover:border-white/20';

                    if (m.status === 'eq1') {
                        col1 = 'text-[#00ff88]'; badge1 = '<span class="bg-[#00ff88]/10 border border-[#00ff88]/30 text-[#00ff88] px-2 py-1 text-[8px] uppercase tracking-widest ml-2 rounded-sm mt-1">Avanza</span>';
                        col2 = 'text-gray-600 line-through'; op2 = 'opacity-40 grayscale';
                        centro = '<span class="text-gray-700 font-bold text-xs uppercase tracking-widest text-center">Finalizado</span>';
                        cardBorder = 'border-[#00ff88]/20 shadow-[0_0_15px_rgba(0,255,136,0.05)]';
                    } else if (m.status === 'eq2') {
                        col2 = 'text-[#00ff88]'; badge2 = '<span class="bg-[#00ff88]/10 border border-[#00ff88]/30 text-[#00ff88] px-2 py-1 text-[8px] uppercase tracking-widest mr-2 rounded-sm mt-1">Avanza</span>';
                        col1 = 'text-gray-600 line-through'; op1 = 'opacity-40 grayscale';
                        centro = '<span class="text-gray-700 font-bold text-xs uppercase tracking-widest text-center">Finalizado</span>';
                        cardBorder = 'border-[#00ff88]/20 shadow-[0_0_15px_rgba(0,255,136,0.05)]';
                    }

                    if (m.eq2 === 'BYE') {
                        centro = '<span class="text-gray-700 font-bold text-xs uppercase tracking-widest text-center">Pase<br>Directo</span>';
                        col2 = 'text-gray-800'; op2 = 'opacity-20 border-dashed';
                        m.eq2 = 'VACANTE';
                        cardBorder = 'border-white/5';
                    }

                    const img1 = getLogoHtml(m.eq1);
                    const img2 = m.eq2 === 'VACANTE' 
                        ? `<div class="w-12 h-12 md:w-16 md:h-16 border border-gray-800 border-dashed rounded-sm flex items-center justify-center"><svg class="w-6 h-6 text-gray-800" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg></div>` 
                        : getLogoHtml(m.eq2);

                    html += `
                        <div class="bg-[#050505] border ${cardBorder} p-6 md:p-8 rounded-sm shadow-lg flex items-center justify-between transition-all duration-300">
                            <div class="flex items-center gap-4 flex-1 ${op1}">
                                ${img1}
                                <div class="flex flex-col items-start">
                                    <h4 class="font-heading text-sm md:text-lg ${col1} font-bold uppercase tracking-widest">${m.eq1}</h4>
                                    ${badge1}
                                </div>
                            </div>
                            <div class="px-4 md:px-8 font-heading flex flex-col items-center">${centro}</div>
                            <div class="flex items-center gap-4 flex-1 justify-end text-right ${op2}">
                                <div class="flex flex-col items-end">
                                    <h4 class="font-heading text-sm md:text-lg ${col2} font-bold uppercase tracking-widest">${m.eq2}</h4>
                                    ${badge2}
                                </div>
                                ${img2}
                            </div>
                        </div>
                    `;
                });

                html += `</div></div>`;
                contenedor.innerHTML += html;
            }
        }
    </script>
</body>
</html>
