<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>5ever | The Arena</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { theme: { extend: { colors: { vctRed: '#ff4655', everGold: '#D4AF37', everDark: '#0f1923' } } } }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Montserrat', sans-serif; background-color: #000; color: #ece8e1; overflow-x: hidden; }
        .font-vct { font-weight: 900; }
        .clip-vct { clip-path: polygon(0 0, 100% 0, 100% calc(100% - 15px), calc(100% - 15px) 100%, 0 100%); }
        .clip-btn { clip-path: polygon(0 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%); }
        .card-hover:hover { border-color: #ff4655; transform: translateX(5px); }
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #000; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #ff4655; }
    </style>
</head>
<body class="selection:bg-vctRed selection:text-white antialiased min-h-screen relative bg-[url('https://www.transparenttextures.com/patterns/stardust.png')]">

    <!-- NAVBAR -->
    <nav class="w-full bg-[#111]/90 backdrop-blur-md border-b border-white/10 py-4 px-6 md:px-12 flex items-center justify-between sticky top-0 z-50">
        <div class="font-vct text-2xl tracking-tighter text-white flex items-center gap-2">
            <span class="text-vctRed">5</span>EVER 
            <div class="h-4 w-px bg-white/20 mx-3 hidden sm:block"></div>
            <span class="text-everGold text-[10px] hidden sm:inline tracking-[0.4em] font-bold">THE ARENA</span>
        </div>
        <a href="registro-torneo.html" class="clip-btn bg-vctRed text-white hover:bg-white hover:text-vctRed text-[9px] font-black uppercase tracking-[0.2em] transition-all px-6 py-3">
            Inscribir Equipo
        </a>
    </nav>

    <div class="max-w-7xl mx-auto px-6 py-16 relative z-10">
        
        <div class="text-center mb-24">
            <h1 class="font-vct text-6xl md:text-8xl text-white uppercase tracking-tighter mb-2 drop-shadow-[0_0_20px_rgba(255,255,255,0.1)]">BATTLE<span class="text-transparent bg-clip-text bg-gradient-to-r from-everGold to-yellow-600">GROUND</span></h1>
            <p class="text-gray-400 text-[10px] tracking-[0.5em] uppercase font-bold">Temporada Oficial</p>
        </div>

        <!-- LEADERBOARD Y ROSTERS -->
        <div class="mb-32">
            <h3 class="font-vct text-2xl md:text-3xl text-white uppercase tracking-tight mb-8 flex items-center gap-4"><div class="w-3 h-3 bg-everGold clip-btn"></div> STANDINGS & ROSTERS</h3>
            
            <div class="bg-[#111] border border-white/5 clip-vct p-6 md:p-8">
                <div class="flex justify-between text-[9px] uppercase tracking-[0.3em] text-gray-500 font-bold border-b border-white/10 pb-4 mb-4 px-2">
                    <span>Escuadra</span>
                    <span>Stats</span>
                </div>
                <div id="tabla-posiciones" class="flex flex-col gap-2">
                    <p class="text-xs text-gray-600 py-8 uppercase tracking-widest text-center">Analizando Datos...</p>
                </div>
            </div>
        </div>

        <!-- CARTELERA DE CRUCES -->
        <div id="contenedor-sorteo" class="flex flex-col gap-20"></div>

    </div>

    <script>
        const API_URL = 'https://bane-esports-web-1.onrender.com/api';
        let dataEquipos = [];
        let contadorVictorias = {}; 

        document.addEventListener('DOMContentLoaded', cargarSorteoCompleto);

        async function cargarSorteoCompleto() {
            const contenedor = document.getElementById('contenedor-sorteo');
            try {
                const resEq = await fetch(`${API_URL}/equipos`);
                if(resEq.ok) {
                    dataEquipos = await resEq.json();
                    dataEquipos.forEach(e => { contadorVictorias[e.nombre] = 0; });
                }

                const resNot = await fetch(`${API_URL}/noticias`);
                const noticias = await resNot.json();
                const bracketData = noticias.find(n => n.titulo === '[BRACKET_DATA]');
                
                if (bracketData && bracketData.descripcion !== '[]') {
                    const matches = JSON.parse(bracketData.descripcion);
                    calcularEstadisticas(matches);
                    renderizarLeaderboard();
                    renderizarCartelera(matches, contenedor);
                } else {
                    renderizarLeaderboard(); // Mostrar rosters aunque no haya bracket
                    contenedor.innerHTML = `<div class="text-center p-12 bg-[#111] border border-white/5 clip-vct"><p class="text-gray-500 font-bold uppercase tracking-widest text-[10px]">Aún no hay cruces registrados.</p></div>`;
                }
            } catch (e) { console.error(e); }
        }

        function calcularEstadisticas(matches) {
            matches.forEach(m => {
                if(m.eq1 && !contadorVictorias[m.eq1]) contadorVictorias[m.eq1] = 0;
                if(m.eq2 && m.eq2 !== 'BYE' && !contadorVictorias[m.eq2]) contadorVictorias[m.eq2] = 0;
                if(m.status === 'eq1') contadorVictorias[m.eq1]++;
                if(m.status === 'eq2' && m.eq2 !== 'BYE') contadorVictorias[m.eq2]++;
            });
        }

        function renderizarLeaderboard() {
            const tabla = document.getElementById('tabla-posiciones');
            tabla.innerHTML = '';
            
            // Ordenar por victorias
            const ganadores = dataEquipos.map(e => ({
                ...e, wins: contadorVictorias[e.nombre] || 0
            })).sort((a, b) => b.wins - a.wins);

            if(ganadores.length === 0) {
                tabla.innerHTML = '<p class="text-[10px] text-gray-500 text-center py-6 uppercase tracking-widest">Registra equipos para ver la tabla.</p>'; return;
            }

            ganadores.forEach((item, index) => {
                const logoHtml = item.logo_url 
                    ? `<img src="${item.logo_url}" class="w-10 h-10 object-contain bg-black p-1 shadow-md">`
                    : `<div class="w-10 h-10 bg-black flex items-center justify-center text-sm text-white font-vct shadow-md">${item.nombre.charAt(0)}</div>`;

                let rankStr = `<span class="text-gray-600 text-xs font-vct w-6">${index + 1}</span>`;
                if(index === 0) rankStr = `<span class="text-everGold text-lg font-vct w-6 drop-shadow-[0_0_5px_rgba(212,175,55,0.8)]">1</span>`;

                // Construir Roster Oculto
                let rosterHtml = '';
                if(item.jugadores && item.jugadores.length > 0) {
                    rosterHtml = `<div id="roster-${index}" class="hidden mt-4 pt-4 border-t border-white/5 grid grid-cols-1 md:grid-cols-2 gap-2 pl-12">`;
                    item.jugadores.forEach(j => {
                        rosterHtml += `
                            <div class="flex items-center justify-between bg-black p-2 px-4 border-l-2 border-vctRed">
                                <span class="text-[10px] text-white font-bold tracking-wider uppercase">${j.riot_id}</span>
                                <a href="${j.tracker_url}" target="_blank" class="text-[8px] bg-[#0f1923] text-gray-400 hover:text-white px-2 py-1 border border-white/10 uppercase tracking-widest hover:border-vctRed transition-colors">Ver Tracker</a>
                            </div>`;
                    });
                    rosterHtml += `</div>`;
                } else {
                    rosterHtml = `<div id="roster-${index}" class="hidden mt-4 pt-4 border-t border-white/5 pl-12 text-[9px] text-gray-500 uppercase tracking-widest">Roster no proporcionado.</div>`;
                }

                tabla.innerHTML += `
                    <div class="bg-[#0a0a0a] border border-transparent hover:border-white/10 p-4 rounded-sm transition-all duration-300 mb-2">
                        <div class="flex items-center justify-between cursor-pointer" onclick="document.getElementById('roster-${index}').classList.toggle('hidden')">
                            <div class="flex items-center gap-4">
                                ${rankStr} ${logoHtml}
                                <span class="font-vct text-sm md:text-base text-white uppercase tracking-wider">${item.nombre}</span>
                            </div>
                            <div class="flex items-center gap-6">
                                <span class="text-xs font-vct text-white tracking-widest">${item.wins} <span class="text-vctRed ml-1">W</span></span>
                                <span class="text-[8px] text-gray-500 uppercase tracking-widest border border-gray-700 px-2 py-1 hover:text-white transition-colors hidden sm:block">Desplegar Roster ▼</span>
                            </div>
                        </div>
                        ${rosterHtml}
                    </div>
                `;
            });
        }

        function getLogoSimple(nombre) {
            const eq = dataEquipos.find(e => e.nombre === nombre);
            if(eq && eq.logo_url) return `<img src="${eq.logo_url}" class="w-16 h-16 md:w-20 md:h-20 object-contain bg-black p-2">`;
            return `<div class="w-16 h-16 md:w-20 md:h-20 bg-black border border-white/5 flex items-center justify-center font-vct text-2xl text-gray-700">${nombre.charAt(0)}</div>`;
        }

        function renderizarCartelera(matches, contenedor) {
            contenedor.innerHTML = '';
            const fases = {}; matches.forEach(m => { if(!fases[m.fase]) fases[m.fase] = []; fases[m.fase].push(m); });

            for (const fase in fases) {
                let html = `<div class="mb-12"><h3 class="font-vct text-xl md:text-2xl text-white uppercase tracking-tighter mb-6 flex items-center gap-3"><div class="w-2 h-8 bg-vctRed clip-btn"></div> ${fase}</h3><div class="grid grid-cols-1 xl:grid-cols-2 gap-6">`;
                fases[fase].forEach(m => {
                    let col1 = 'text-white', col2 = 'text-white', op1 = '', op2 = '';
                    let badge1 = '', badge2 = '';
                    let bgStyle = 'bg-[#111] hover:bg-[#151515]';
                    let centro = '<span class="text-vctRed font-vct text-2xl md:text-4xl opacity-50">VS</span>';
                    
                    if (m.score1 && m.score2) {
                        centro = `<div class="flex flex-col items-center"><span class="text-everGold font-vct text-3xl md:text-4xl">${m.score1} <span class="text-gray-600">-</span> ${m.score2}</span></div>`;
                    } else if (m.status !== 'pending' && m.eq2 !== 'BYE') { centro = '<span class="text-gray-600 font-bold text-[9px] uppercase tracking-widest text-center">FINALIZADO</span>'; }

                    if (m.status === 'eq1') {
                        col1 = 'text-everGold'; badge1 = '<span class="text-everGold border border-everGold/30 px-2 py-0.5 text-[8px] uppercase tracking-widest mt-1 font-bold">WIN</span>';
                        col2 = 'text-gray-600 line-through'; op2 = 'opacity-30 grayscale';
                    } else if (m.status === 'eq2') {
                        col2 = 'text-everGold'; badge2 = '<span class="text-everGold border border-everGold/30 px-2 py-0.5 text-[8px] uppercase tracking-widest mt-1 font-bold">WIN</span>';
                        col1 = 'text-gray-600 line-through'; op1 = 'opacity-30 grayscale';
                    }

                    if (m.eq2 === 'BYE') { centro = '<span class="text-gray-600 font-bold text-[8px] uppercase tracking-widest text-center">BYE</span>'; col2 = 'text-gray-800'; op2 = 'opacity-10'; m.eq2 = 'VACANTE'; bgStyle = 'bg-black'; }

                    const img1 = getLogoSimple(m.eq1);
                    const img2 = m.eq2 === 'VACANTE' ? `<div class="w-16 h-16 md:w-20 md:h-20 border border-gray-800 border-dashed flex items-center justify-center"></div>` : getLogoSimple(m.eq2);

                    html += `
                        <div class="clip-vct ${bgStyle} border-l-4 border-transparent hover:border-vctRed p-6 flex items-center justify-between transition-all duration-300 card-hover">
                            <div class="flex items-center gap-4 flex-1 ${op1}">
                                ${img1}
                                <div class="flex flex-col items-start overflow-hidden"><h4 class="font-vct text-sm md:text-lg ${col1} uppercase tracking-wider truncate max-w-[120px] md:max-w-full">${m.eq1}</h4>${badge1}</div>
                            </div>
                            <div class="px-2 md:px-6 font-vct flex flex-col items-center">${centro}</div>
                            <div class="flex items-center gap-4 flex-1 justify-end text-right ${op2}">
                                <div class="flex flex-col items-end overflow-hidden"><h4 class="font-vct text-sm md:text-lg ${col2} uppercase tracking-wider truncate max-w-[120px] md:max-w-full">${m.eq2}</h4>${badge2}</div>
                                ${img2}
                            </div>
                        </div>
                    `;
                });
                html += `</div></div>`; contenedor.innerHTML += html;
            }
        }
    </script>
</body>
</html>
