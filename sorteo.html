<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>5ever | The Arena</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { 
            theme: { 
                extend: { 
                    colors: { 
                        everRed: '#E60000', 
                        everGold: '#D4AF37',
                        everDark: '#0a0a0a'
                    } 
                } 
            } 
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800;900&family=Montserrat:wght@300;400;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Montserrat', sans-serif; background-color: #030303; color: white; overflow-x: hidden; }
        .font-heading { font-family: 'Cinzel', serif; }
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #030303; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #D4AF37; border-radius: 10px; }
        .gold-glow { box-shadow: 0 0 15px rgba(212, 175, 55, 0.15); }
    </style>
</head>
<body class="selection:bg-everRed selection:text-white antialiased">

    <!-- Navbar Aislado 5ever -->
    <nav class="w-full bg-[#050505] border-b border-white/5 py-5 px-6 md:px-12 flex items-center justify-between z-50 relative sticky top-0">
        <div class="font-heading text-3xl font-black tracking-widest text-white flex items-center gap-2">
            <span class="text-everRed">5</span>EVER <span class="text-everGold text-xs ml-2 hidden sm:inline tracking-[0.3em] font-normal border-l border-white/20 pl-3">CHAMPIONSHIP</span>
        </div>
        <a href="registro-torneo.html" class="text-everGold hover:text-black text-[10px] font-bold uppercase tracking-[0.2em] transition-all border border-everGold/50 hover:bg-everGold px-6 py-2.5 shadow-[0_0_10px_rgba(212,175,55,0.2)]">
            Inscribir Equipo
        </a>
    </nav>

    <div class="max-w-7xl mx-auto px-6 py-16 relative z-10">
        <div class="text-center mb-20">
            <h1 class="font-heading text-5xl md:text-7xl font-black text-transparent bg-clip-text bg-gradient-to-r from-everGold via-white to-everRed uppercase tracking-widest mb-4 drop-shadow-lg">La Arena</h1>
            <p class="font-primary text-gray-400 text-xs tracking-[0.3em] uppercase">Status Global del Torneo</p>
        </div>

        <!-- TABLA DE POSICIONES -->
        <div class="mb-24">
            <div class="flex items-center gap-6 mb-10 justify-center opacity-80">
                <div class="w-16 h-[1px] bg-gradient-to-l from-everGold to-transparent"></div>
                <h3 class="font-heading text-xl md:text-2xl font-bold text-everGold uppercase tracking-[0.2em] text-center">Clasificación Élite</h3>
                <div class="w-16 h-[1px] bg-gradient-to-r from-everGold to-transparent"></div>
            </div>
            
            <div class="max-w-4xl mx-auto bg-everDark border border-everGold/20 rounded-sm p-6 md:p-8 gold-glow">
                <div class="flex justify-between text-[9px] uppercase tracking-[0.2em] text-gray-500 font-bold border-b border-white/10 pb-4 mb-4 px-4">
                    <span>Escuadra</span>
                    <span>Victorias</span>
                </div>
                <div id="tabla-posiciones" class="flex flex-col gap-2">
                    <p class="text-xs text-gray-600 text-center py-4 uppercase tracking-widest">Sincronizando base de datos...</p>
                </div>
            </div>
        </div>

        <!-- CARTELERA DE CRUCES -->
        <div id="contenedor-sorteo" class="flex flex-col gap-20"></div>

    </div>

    <script>
        const API_URL = 'https://bane-esports-web-1.onrender.com/api';
        let diccionarioLogos = {};
        let contadorVictorias = {}; 

        document.addEventListener('DOMContentLoaded', cargarSorteoCompleto);

        async function cargarSorteoCompleto() {
            const contenedor = document.getElementById('contenedor-sorteo');
            try {
                const resEq = await fetch(`${API_URL}/equipos`);
                if(resEq.ok) {
                    const equipos = await resEq.json();
                    equipos.forEach(e => {
                        if (e.logo_url) diccionarioLogos[e.nombre] = e.logo_url;
                        contadorVictorias[e.nombre] = 0; 
                    });
                }

                const resNot = await fetch(`${API_URL}/noticias`);
                const noticias = await resNot.json();
                const bracketData = noticias.find(n => n.titulo === '[BRACKET_DATA]');
                
                if (bracketData && bracketData.descripcion !== '[]') {
                    const matches = JSON.parse(bracketData.descripcion);
                    calcularEstadisticas(matches);
                    renderizarLeaderboard();
                    renderizarCartelera(matches, contenedor);
                } else {
                    contenedor.innerHTML = `<div class="text-center p-12 border border-white/5 bg-everDark"><p class="text-gray-600 uppercase tracking-widest text-xs">Aún no hay cruces registrados.</p></div>`;
                }
            } catch (e) { console.error(e); }
        }

        function calcularEstadisticas(matches) {
            matches.forEach(m => {
                if(!contadorVictorias[m.eq1]) contadorVictorias[m.eq1] = 0;
                if(m.eq2 !== 'BYE' && !contadorVictorias[m.eq2]) contadorVictorias[m.eq2] = 0;

                if(m.status === 'eq1') contadorVictorias[m.eq1]++;
                if(m.status === 'eq2' && m.eq2 !== 'BYE') contadorVictorias[m.eq2]++;
            });
        }

        function renderizarLeaderboard() {
            const tabla = document.getElementById('tabla-posiciones');
            tabla.innerHTML = '';
            const listaOrdenada = Object.keys(contadorVictorias).map(nombre => ({ nombre, wins: contadorVictorias[nombre] })).sort((a, b) => b.wins - a.wins);
            const ganadores = listaOrdenada.filter(item => item.wins > 0);

            if(ganadores.length === 0) {
                tabla.innerHTML = '<p class="text-[10px] text-gray-600 text-center py-4 uppercase tracking-widest">Las posiciones se actualizarán al finalizar el primer mapa.</p>';
                return;
            }

            ganadores.forEach((item, index) => {
                const logoHtml = diccionarioLogos[item.nombre] 
                    ? `<img src="${diccionarioLogos[item.nombre]}" class="w-8 h-8 object-contain rounded-sm bg-black border border-white/5 p-1">`
                    : `<div class="w-8 h-8 bg-black border border-white/5 rounded-sm flex items-center justify-center text-xs text-everGold font-heading">${item.nombre.charAt(0)}</div>`;

                let medalla = `<span class="text-gray-600 text-[10px] font-bold w-6">#${index + 1}</span>`;
                if(index === 0) medalla = `<span class="text-everGold text-sm font-black w-6 drop-shadow-[0_0_5px_rgba(212,175,55,0.8)]">I</span>`;
                if(index === 1) medalla = `<span class="text-gray-300 text-sm font-black w-6">II</span>`;
                if(index === 2) medalla = `<span class="text-everRed text-sm font-black w-6">III</span>`;

                tabla.innerHTML += `
                    <div class="flex items-center justify-between bg-black/60 border border-white/5 p-3 px-5 rounded-sm hover:border-everGold/50 transition-colors">
                        <div class="flex items-center gap-5">
                            ${medalla}
                            ${logoHtml}
                            <span class="font-heading text-xs md:text-sm font-bold uppercase tracking-[0.1em] text-white">${item.nombre}</span>
                        </div>
                        <div class="flex items-center gap-2">
                            <span class="text-xs font-bold text-everRed tracking-widest">${item.wins} <span class="text-everGold">W</span></span>
                        </div>
                    </div>
                `;
            });
        }

        function getLogoHtml(nombreEquipo) {
            if(diccionarioLogos[nombreEquipo]) {
                return `<img src="${diccionarioLogos[nombreEquipo]}" class="w-14 h-14 md:w-20 md:h-20 object-contain bg-black border border-white/5 p-2 rounded-sm shadow-lg">`;
            }
            return `<div class="w-14 h-14 md:w-20 md:h-20 bg-black border border-white/5 rounded-sm flex items-center justify-center font-heading text-2xl text-gray-700">${nombreEquipo.charAt(0)}</div>`;
        }

        function renderizarCartelera(matches, contenedor) {
            contenedor.innerHTML = '';
            const fases = {};
            matches.forEach(m => {
                if(!fases[m.fase]) fases[m.fase] = [];
                fases[m.fase].push(m);
            });

            for (const fase in fases) {
                let html = `
                    <div class="mb-4">
                        <h3 class="font-heading text-xl md:text-2xl font-black text-white uppercase tracking-[0.2em] mb-8 border-l-4 border-everRed pl-4 opacity-90">${fase}</h3>
                        <div class="grid grid-cols-1 xl:grid-cols-2 gap-8">
                `;

                fases[fase].forEach(m => {
                    let col1 = 'text-white', col2 = 'text-white';
                    let op1 = 'opacity-100', op2 = 'opacity-100';
                    let badge1 = '', badge2 = '';
                    let cardBorder = 'border-white/5 hover:border-everRed/30';
                    let centro = '<span class="text-everRed font-black text-3xl md:text-4xl drop-shadow-[0_0_15px_rgba(230,0,0,0.4)]">VS</span>';
                    
                    if (m.score1 && m.score2) {
                        centro = `
                            <div class="flex flex-col items-center">
                                <span class="text-everGold font-black text-4xl drop-shadow-[0_0_10px_rgba(212,175,55,0.4)]">${m.score1} <span class="text-white mx-1">-</span> ${m.score2}</span>
                                <span class="text-gray-500 text-[8px] uppercase tracking-[0.2em] mt-2 font-bold">Marcador Final</span>
                            </div>
                        `;
                    } else if (m.status !== 'pending' && m.eq2 !== 'BYE') {
                        centro = '<span class="text-gray-600 font-bold text-xs uppercase tracking-widest text-center">FINALIZADO</span>';
                    }

                    if (m.status === 'eq1') {
                        col1 = 'text-everGold drop-shadow-[0_0_5px_rgba(212,175,55,0.5)]'; 
                        badge1 = '<span class="bg-everGold/10 border border-everGold/50 text-everGold px-3 py-1 text-[8px] uppercase tracking-[0.2em] rounded-sm mt-1 font-bold">Victoria</span>';
                        col2 = 'text-gray-700 line-through'; op2 = 'opacity-30 grayscale';
                        cardBorder = 'border-everGold/30 gold-glow';
                    } else if (m.status === 'eq2') {
                        col2 = 'text-everGold drop-shadow-[0_0_5px_rgba(212,175,55,0.5)]'; 
                        badge2 = '<span class="bg-everGold/10 border border-everGold/50 text-everGold px-3 py-1 text-[8px] uppercase tracking-[0.2em] rounded-sm mt-1 font-bold">Victoria</span>';
                        col1 = 'text-gray-700 line-through'; op1 = 'opacity-30 grayscale';
                        cardBorder = 'border-everGold/30 gold-glow';
                    }

                    if (m.eq2 === 'BYE') {
                        centro = '<span class="text-gray-600 font-bold text-[9px] uppercase tracking-widest text-center">PASE<br>DIRECTO</span>';
                        col2 = 'text-gray-800'; op2 = 'opacity-10 border-dashed';
                        m.eq2 = 'VACANTE';
                        cardBorder = 'border-white/5';
                    }

                    const img1 = getLogoHtml(m.eq1);
                    const img2 = m.eq2 === 'VACANTE' 
                        ? `<div class="w-14 h-14 md:w-20 md:h-20 border border-gray-800 border-dashed rounded-sm flex items-center justify-center"><svg class="w-6 h-6 text-gray-800" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg></div>` 
                        : getLogoHtml(m.eq2);

                    html += `
                        <div class="bg-everDark border ${cardBorder} p-6 md:p-8 rounded-sm flex items-center justify-between transition-all duration-500">
                            <div class="flex items-center gap-5 flex-1 ${op1}">
                                ${img1}
                                <div class="flex flex-col items-start overflow-hidden">
                                    <h4 class="font-heading text-sm md:text-lg ${col1} font-black uppercase tracking-widest truncate max-w-[120px] md:max-w-full">${m.eq1}</h4>
                                    ${badge1}
                                </div>
                            </div>
                            <div class="px-2 md:px-6 font-heading flex flex-col items-center">${centro}</div>
                            <div class="flex items-center gap-5 flex-1 justify-end text-right ${op2}">
                                <div class="flex flex-col items-end overflow-hidden">
                                    <h4 class="font-heading text-sm md:text-lg ${col2} font-black uppercase tracking-widest truncate max-w-[120px] md:max-w-full">${m.eq2}</h4>
                                    ${badge2}
                                </div>
                                ${img2}
                            </div>
                        </div>
                    `;
                });
                html += `</div></div>`;
                contenedor.innerHTML += html;
            }
        }
    </script>
</body>
</html>
